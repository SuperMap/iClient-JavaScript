<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="resources.title_videoMapWithTime_huainanDraw"></title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #layout {
        position: absolute;
        inset: 0;
        display: flex;
      }

      #videoPane,
      #realPane {
        position: relative;
        width: 50%;
        height: 100%;
      }

      #videoPane {
        border-right: 1px solid #d9d9d9;
      }

      #videoMap,
      #map {
        position: absolute;
        inset: 0;
      }

      .pane-label {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 11;
        padding: 4px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 13px;
        pointer-events: none;
      }

      .measurement-marker {
        padding: 4px 7px;
        border: 1px solid #e66b2e;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        color: #17324d;
        font-size: 12px;
        line-height: 1.3;
        white-space: nowrap;
        pointer-events: none;
      }

      .mapboxgl-popup-content {
        box-sizing: border-box;
        width: 260px;
        max-height: 320px;
        padding: 28px 4px 12px 12px;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .feature-popup table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        table-layout: fixed;
      }

      .feature-popup td {
        padding: 2px 8px 2px 0;
        vertical-align: top;
        word-break: break-all;
      }

      .feature-popup td:first-child {
        width: 38%;
        color: #888;
      }

      #drawActions {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 12;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 32px);
        padding: 8px 10px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 13px;
      }

      #drawActions button {
        padding: 4px 16px;
        border: 1px solid #1677ff;
        border-radius: 3px;
        background: #1677ff;
        color: #fff;
        font-size: 13px;
        line-height: 20px;
        cursor: pointer;
      }

      #drawActions button:disabled {
        border-color: #d9d9d9;
        background: #f5f5f5;
        color: rgba(0, 0, 0, 0.25);
        cursor: not-allowed;
      }

      #drawActions .draw-status {
        color: rgba(0, 0, 0, 0.65);
      }

      @media (max-width: 720px) {
        #layout {
          flex-direction: column;
        }

        #videoPane,
        #realPane {
          width: 100%;
          height: 50%;
        }

        #videoPane {
          border-right: 0;
          border-bottom: 1px solid #d9d9d9;
        }
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="videoPane">
        <div class="pane-label" data-i18n="resources.text_huainanDraw_videoMapLabel"></div>
        <div id="videoMap"></div>
        <div id="drawActions">
          <button id="saveDrawBtn" type="button" data-i18n="resources.text_videoMapDraw_save" disabled></button>
          <span id="drawStatus" class="draw-status"></span>
        </div>
      </div>
      <div id="realPane">
        <div class="pane-label" data-i18n="resources.text_huainanDraw_realMapLabel"></div>
        <div id="map"></div>
      </div>
    </div>
    <script type="text/javascript" include="bootstrap" src="../js/include-web.js"></script>
    <script
      type="text/javascript"
      include="mapbox-gl-enhance,draw,proj4,turf,videojs,opencv"
      src="../../dist/mapboxgl/include-mapboxgl.js"
    ></script>
    <script type="text/javascript">
      var host = 'http://172.16.14.44:8090';
      var dataUrl = host + '/iserver/services/data-huainan/rest/data';
      var dataSourceName = 'video_1';
      var dataSourceUrl = dataUrl + '/datasources/' + dataSourceName
      var datasetUrl = {
        Point: dataSourceUrl + '/datasets/NewPoint',
        LineString: dataSourceUrl + '/datasets/NewLine',
        Polygon: dataSourceUrl + '/datasets/NewRegion'
      };
      var VIDEO_DRAW_SOURCE_ID = 'huainan-video-draw-sync';
      var REAL_VIDEO_DRAW_SOURCE_ID = 'huainan-real-video-draw-sync';
      var VIDEO_BOUNDS_SOURCE_ID = 'huainan-video-bounds';
      var videoMap;
      var map;
      var mapDraw;
      var mapReady = false;
      var pendingRealSources = {};
      var mapSourceCount = 0;
      var dynamicLayerIds = [];
      var measurementMarkers = {};
      var uploadedDatasetRefreshVersions = {};
      var pendingVideoDrawIds = {};
      var pendingMapDrawIds = {};
      var savingDraw = false;
      // 天地图标绘要素 id -> 服务端 SmID，用于删除时定位已上传的要素
      var mapDrawSmIDs = {};
      var mapBearing = 214;
      var tk = '1d109683f4d84198e37a38c442d68311';
      var attribution =
        "© <a href='https://www.tianditu.gov.cn' target='_blank'>天地图</a>" +
        " with <span>© <a href='https://iclient.supermap.io' target='_blank'>SuperMap iClient</a></span> ";

      function initMap() {
        map = new mapboxgl.Map({
          container: 'map',
          style: {
            version: 8,
            sources: {
              tianditu_img: {
                attribution: attribution,
                type: 'raster',
                tiles: ['http://t4.tianditu.com/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=' + tk],
                tileSize: 256
              },
              tianditu_cia: {
                type: 'raster',
                tiles: ['http://t4.tianditu.com/DataServer?T=cia_w&x={x}&y={y}&l={z}&tk=' + tk],
                tileSize: 256
              }
            },
            layers: [
              { id: 'tianditu-img', type: 'raster', source: 'tianditu_img', minzoom: 0, maxzoom: 18 },
              { id: 'tianditu-cia', type: 'raster', source: 'tianditu_cia', minzoom: 0, maxzoom: 18 }
            ]
          },
          center: [116.8500991647519, 32.577504319585],
          zoom: 16,
          bearing: mapBearing,
          pitch: 4.5,
          maxZoom: 18
        });
        map.addControl(new mapboxgl.NavigationControl(), 'top-left');
        mapDraw = new MapboxDraw({
          displayControlsDefault: false,
          controls: { point: true, line_string: true, polygon: true, trash: true }
        });
        window.map = map;
        map.addControl(mapDraw, 'top-left');
        map.addControl(new mapboxgl.supermap.LogoControl({ link: 'https://iclient.supermap.io' }), 'bottom-right');
        ['draw.create', 'draw.update', 'draw.delete', 'draw.render'].forEach(function (eventName) {
          map.on(eventName, syncMapDraw);
        });
        // 天地图上的新增标绘同样上传到 iServer，并支持删除
        map.on('draw.create', function (event) {
          (event.features || []).forEach(function (feature) {
            if (feature.id != null) {
              pendingMapDrawIds[String(feature.id)] = true;
            }
          });
          refreshDrawActions();
        });
        map.on('draw.delete', function (event) {
          (event.features || []).forEach(deleteMapDrawFeature);
          refreshDrawActions();
        });
        map.on('load', function () {
          mapReady = true;
          Object.keys(pendingRealSources).forEach(function (sourceId) {
            var pending = pendingRealSources[sourceId];
            addOrUpdateRealSource(sourceId, pending.data, pending.color);
          });
          pendingRealSources = {};
          updateVideoBounds();
          bindSaveButton();
        });
      }
      
      function updateVideoBounds() {
        if (!videoMap || !mapReady || !videoMap.getVideoBounds) {
          return;
        }
        var bounds = videoMap.getVideoBounds();
        if (!bounds) {
          return;
        }
        var featureCollection = { type: 'FeatureCollection', features: [bounds] };
        var source = map.getSource(VIDEO_BOUNDS_SOURCE_ID);
        if (source) {
          source.setData(featureCollection);
          return;
        }
        map.addSource(VIDEO_BOUNDS_SOURCE_ID, { type: 'geojson', data: featureCollection });
        map.addLayer({
          id: VIDEO_BOUNDS_SOURCE_ID + '-fill',
          type: 'fill',
          source: VIDEO_BOUNDS_SOURCE_ID,
          paint: { 'fill-color': '#f59e0b', 'fill-opacity': 0.08 }
        });
        map.addLayer({
          id: VIDEO_BOUNDS_SOURCE_ID + '-outline',
          type: 'line',
          source: VIDEO_BOUNDS_SOURCE_ID,
          paint: { 'line-color': '#f59e0b', 'line-width': 2, 'line-dasharray': [2, 1] }
        });
      }

      function addOrUpdateRealSource(sourceId, data, color) {
        if (!mapReady) {
          pendingRealSources[sourceId] = { data: data, color: color };
          return;
        }
        var existing = map.getSource(sourceId);
        if (existing) {
          existing.setData(data);
          return;
        }
        map.addSource(sourceId, { type: 'geojson', data: data });
        var suffix = ++mapSourceCount;
        map.addLayer({
          id: 'real-fill-' + suffix,
          type: 'fill',
          source: sourceId,
          filter: ['==', '$type', 'Polygon'],
          paint: { 'fill-color': color, 'fill-opacity': 0.25 }
        });
        map.addLayer({
          id: 'real-line-' + suffix,
          type: 'line',
          source: sourceId,
          filter: ['in', '$type', 'LineString', 'Polygon'],
          paint: { 'line-color': color, 'line-width': 3 }
        });
        map.addLayer({
          id: 'real-point-' + suffix,
          type: 'circle',
          source: sourceId,
          filter: ['==', '$type', 'Point'],
          paint: { 'circle-radius': 5, 'circle-color': color, 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' }
        });
      }

      function queryFeatures(datasetName) {
        var sqlParam = new mapboxgl.supermap.GetFeaturesBySQLParameters({
          queryParameter: { name: datasetName + '@' + dataSourceName },
          targetEpsgCode: '4326',
          datasetNames: [dataSourceName + ':' + datasetName],
          toIndex: 99999
        });
        return new mapboxgl.supermap.FeatureService(dataUrl).getFeaturesBySQL(sqlParam);
      }

      function addVectorDataset(datasetName) {
        queryFeatures(datasetName).then(function (serviceResult) {
          var features = serviceResult.result.features;
          if (!features || !features.features || !features.features.length) {
            return;
          }
          var sourceId = 'dynamic-source-' + dynamicLayerIds.length;
          var layerId = 'dynamic-layer-' + dynamicLayerIds.length;
          videoMap.addSource(sourceId, { type: 'geojson', data: features });
          addOrUpdateRealSource(sourceId, features, '#e66b2e');
          var type = features.features[0].geometry.type;
          videoMap.addLayer({
            id: layerId,
            type: /Point/.test(type) ? 'circle' : /Line/.test(type) ? 'line' : 'fill',
            source: sourceId,
            paint: /Point/.test(type)
              ? { 'circle-radius': 5, 'circle-color': '#e66b2e', 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' }
              : /Line/.test(type)
                ? { 'line-width': 4, 'line-color': '#e66b2e' }
                : { 'fill-color': '#48cae4', 'fill-opacity': 0.45 }
          });
          dynamicLayerIds.push(layerId);
          videoMap.on('click', function (e) {
            var rendered = videoMap.queryRenderedFeatures(e.point, { layers: [layerId] });
            if (!rendered.length) {
              return;
            }
            var properties = rendered[0].properties;
            var html = '<div class="feature-popup"><h4 style="margin:0 0 8px;font-size:13px;">' + datasetName + '</h4><table>';
            Object.keys(properties).forEach(function (key) {
              html += '<tr><td>' + key + '</td><td>' + properties[key] + '</td></tr>';
            });
            html += '</table></div>';
            var popup = new mapboxgl.Popup({ closeButton: true, closeOnClick: true, maxWidth: '260px' })
              .setLngLat(e.lngLat)
              .setHTML(html)
              .addTo(videoMap);
          });
        });
      }

      function refreshUploadedDataset(datasetName) {
        var refreshVersion = (uploadedDatasetRefreshVersions[datasetName] || 0) + 1;
        uploadedDatasetRefreshVersions[datasetName] = refreshVersion;
        queryFeatures(datasetName).then(function (serviceResult) {
          var queriedFeatureCollection = serviceResult && serviceResult.result && serviceResult.result.features;
          if (
            refreshVersion !== uploadedDatasetRefreshVersions[datasetName] ||
            !queriedFeatureCollection ||
            !Array.isArray(queriedFeatureCollection.features)
          ) {
            return;
          }
          var featureCollection = {
            type: 'FeatureCollection',
            features: queriedFeatureCollection.features
          };
          var sourceId = 'uploaded-draw-source-' + datasetName;
          addOrUpdateRealSource('real-' + sourceId, featureCollection, '#e66b2e');
          if (!videoMap) {
            return;
          }
          var source = videoMap.getSource(sourceId);
          if (source) {
            source.setData(featureCollection);
            bringVideoDrawLayersToFront();
            return;
          }
          videoMap.addSource(sourceId, { type: 'geojson', data: featureCollection });
          var layerConfigs = [
            {
              id: sourceId + '-fill',
              type: 'fill',
              filter: ['==', '$type', 'Polygon'],
              paint: { 'fill-color': '#48cae4', 'fill-opacity': 0.35 }
            },
            {
              id: sourceId + '-line',
              type: 'line',
              filter: ['in', '$type', 'LineString', 'Polygon'],
              paint: { 'line-color': '#e66b2e', 'line-width': 4 }
            },
            {
              id: sourceId + '-point',
              type: 'circle',
              filter: ['==', '$type', 'Point'],
              paint: { 'circle-radius': 5, 'circle-color': '#e66b2e', 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' }
            }
          ];
          layerConfigs.forEach(function (layerConfig) {
            videoMap.addLayer({
              id: layerConfig.id,
              type: layerConfig.type,
              source: sourceId,
              filter: layerConfig.filter,
              paint: layerConfig.paint
            });
            dynamicLayerIds.push(layerConfig.id);
          });
          bringVideoDrawLayersToFront();
        }).catch(function (error) {
          console.error(resources.text_videoMapDraw_queryFailed, error);
        });
      }

      function bringVideoDrawLayersToFront() {
        if (!videoMap || !videoMap.moveLayer) {
          return;
        }
        ['video-draw-fill', 'video-draw-line', 'video-draw-point'].forEach(function (layerId) {
          if (videoMap.getLayer(layerId)) {
            videoMap.moveLayer(layerId);
          }
        });
      }

      function syncVideoMapDraw(featureCollection) {
        var source = videoMap && videoMap.sourceCache && videoMap.sourceCache[REAL_VIDEO_DRAW_SOURCE_ID];
        if (source) {
          source.setData(featureCollection);
        }
      }

      function syncMapDraw() {
        if (!mapDraw) {
          return;
        }
        var features = mapDraw.getAll();
        addOrUpdateRealSource(REAL_VIDEO_DRAW_SOURCE_ID, features, '#168aad');
        syncVideoMapDraw(features);
        updateMeasurementMarkers('video', videoMap, features, true);
      }

      function syncVideoDraw(featureCollection) {
        if (!featureCollection) {
          return;
        }
        addOrUpdateRealSource(VIDEO_DRAW_SOURCE_ID, featureCollection, '#ff5a36');
        updateMeasurementMarkers('video-draw-video', videoMap, featureCollection, true);
      }

      function resolveDatasetPath(feature) {
        if (!feature || !feature.geometry) {
          return null;
        }
        var targetUrl = datasetUrl[feature.geometry.type];
        if (!targetUrl) {
          return null;
        }
        return targetUrl.match(/^(.*)\/datasources\/([^/]+)\/datasets\/([^/?#]+)\/?$/);
      }

      function toUploadFeature(feature) {
        return {
          type: 'Feature',
          properties: {},
          geometry: {
            type: feature.geometry.type,
            coordinates: JSON.parse(JSON.stringify(feature.geometry.coordinates))
          }
        };
      }

      function uploadServerFeature(feature) {
        var datasetPath = resolveDatasetPath(feature);
        if (!datasetPath) {
          return Promise.resolve(null);
        }
        var editFeaturesService = new mapboxgl.supermap.FeatureService(datasetPath[1]);
        var editFeaturesParams = new mapboxgl.supermap.EditFeaturesParameters({
          features: [toUploadFeature(feature)],
          dataSourceName: decodeURIComponent(datasetPath[2]),
          dataSetName: decodeURIComponent(datasetPath[3]),
          editType: 'add',
          returnContent: true
        });
        return editFeaturesService.editFeatures(editFeaturesParams).then(function (serviceResult) {
          var result = serviceResult && serviceResult.result;
          if (!result || result.succeed === false) {
            return null;
          }
          // returnContent 为 true 时返回新建要素的 ID 数组，回填 SmID 以便删除时定位服务端要素
          var SmID = Array.isArray(result) ? result[0] : result.SmID;
          return SmID != null ? SmID : findUploadedSmID(feature);
        }).catch(function (error) {
          console.error(resources.text_videoMapDraw_uploadFailed, error);
          return null;
        });
      }

      function findUploadedSmID(feature) {
        var datasetPath = resolveDatasetPath(feature);
        if (!datasetPath) {
          return Promise.resolve(null);
        }
        var dataset = decodeURIComponent(datasetPath[3]);
        var sqlParam = new mapboxgl.supermap.GetFeaturesBySQLParameters({
          queryParameter: { name: dataset + '@' + dataSourceName },
          targetEpsgCode: '4326',
          datasetNames: [dataSourceName + ':' + dataset],
          toIndex: 99999
        });
        return new mapboxgl.supermap.FeatureService(dataUrl).getFeaturesBySQL(sqlParam).then(function (serviceResult) {
          var featureCollection = serviceResult && serviceResult.result && serviceResult.result.features;
          var target = JSON.stringify(feature.geometry);
          var serverFeature = ((featureCollection && featureCollection.features) || []).find(function (item) {
            return JSON.stringify(item.geometry) === target;
          });
          if (!serverFeature) {
            return null;
          }
          var properties = serverFeature.properties || {};
          return properties.SMID != null ? properties.SMID : serverFeature.id;
        }).catch(function (error) {
          console.error(resources.text_videoMapDraw_findFailed, error);
          return null;
        });
      }

      function saveDrawFeatures() {
        if (savingDraw) {
          return;
        }
        var videoFeatures = getPendingVideoDrawFeatures();
        var mapFeatures = getPendingMapDrawFeatures();
        if (!videoFeatures.length && !mapFeatures.length) {
          return;
        }
        savingDraw = true;
        refreshDrawActions();
        var chain = Promise.resolve();
        videoFeatures.concat(mapFeatures).forEach(function (feature) {
          chain = chain.then(function () {
            return uploadServerFeature(feature).then(function (SmID) {
              if (SmID == null) {
                return;
              }
              if (videoFeatures.indexOf(feature) !== -1) {
                rememberVideoDrawSmID(feature, SmID);
                delete pendingVideoDrawIds[feature.id];
              } else {
                mapDrawSmIDs[String(feature.id)] = SmID;
                delete pendingMapDrawIds[String(feature.id)];
              }
              refreshDrawActions();
            });
          });
        });
        chain.then(function () {
          savingDraw = false;
          ['NewPoint', 'NewLine', 'NewRegion'].forEach(refreshUploadedDataset);
          refreshDrawActions();
        }).catch(function (error) {
          savingDraw = false;
          console.error(resources.text_videoMapDraw_saveFailed, error);
          refreshDrawActions();
        });
      }

      function getFeatureSmID(feature) {
        if (!feature) {
          return null;
        }
        var properties = feature.properties || {};
        return properties.SmID != null ? properties.SmID : properties.SMID;
      }

      function rememberVideoDrawSmID(feature, SmID) {
        if (!feature || feature.id == null || SmID == null) {
          return;
        }
        feature.properties = feature.properties || {};
        feature.properties.SmID = SmID;
      }

      function getPendingVideoDrawFeatures() {
        return videoMap && videoMap.getDrawData
          ? (videoMap.getDrawData().features || []).filter(function (feature) {
              return feature.id != null && pendingVideoDrawIds[feature.id] && getFeatureSmID(feature) == null;
            })
          : [];
      }

      function getPendingMapDrawFeatures() {
        return mapDraw ? (mapDraw.getAll().features || []).filter(function (feature) {
          return feature.id != null && pendingMapDrawIds[String(feature.id)] && getFeatureSmID(feature) == null;
        }) : [];
      }

      function refreshDrawActions() {
        var button = document.getElementById('saveDrawBtn');
        var status = document.getElementById('drawStatus');
        if (!button || !status) {
          return;
        }
        var count = getPendingVideoDrawFeatures().length + getPendingMapDrawFeatures().length;
        button.disabled = savingDraw || !count;
        status.textContent = savingDraw
          ? resources.text_videoMapDraw_saving
          : count
            ? resources.text_videoMapDraw_pending.replace('{count}', count)
            : resources.text_videoMapDraw_saveHint;
      }

      function bindSaveButton() {
        var button = document.getElementById('saveDrawBtn');
        if (button) {
          button.addEventListener('click', saveDrawFeatures);
        }
        refreshDrawActions();
      }

      function deleteUploadedFeature(feature, SmID) {
        if (!feature || feature.id == null) {
          return;
        }
        var wasPending = !!pendingVideoDrawIds[feature.id];
        delete pendingVideoDrawIds[feature.id];
        var datasetPath = resolveDatasetPath(feature);
        if (!datasetPath) {
          return;
        }
        if (SmID == null) {
          SmID = getFeatureSmID(feature);
        }
        if (SmID != null) {
          deleteServerFeature(datasetPath, SmID);
          return;
        }
        if (wasPending) {
          refreshDrawActions();
          return;
        }
        // 未记录 SmID（如上传播报未返回）时，按几何从服务端反查后再删除
        var dataset = decodeURIComponent(datasetPath[3]);
        var sqlParam = new mapboxgl.supermap.GetFeaturesBySQLParameters({
          queryParameter: { name: dataset + '@' + dataSourceName },
          targetEpsgCode: '4326',
          datasetNames: [dataSourceName + ':' + dataset],
          toIndex: 99999
        });
        new mapboxgl.supermap.FeatureService(dataUrl).getFeaturesBySQL(sqlParam).then(function (serviceResult) {
          var featureCollection = serviceResult && serviceResult.result && serviceResult.result.features;
          var serverFeature = featureCollection && (featureCollection.features || []).find(function (item) {
            return JSON.stringify(item.geometry) === JSON.stringify(feature.geometry);
          });
          if (!serverFeature || serverFeature.id == null) {
            return;
          }
          deleteServerFeature(datasetPath, serverFeature.id);
        }).catch(function (error) {
          console.error(resources.text_videoMapDraw_deleteFailed, error);
        });
      }

      function deleteMapDrawFeature(feature) {
        var featureId = feature && feature.id != null ? String(feature.id) : null;
        var wasPending = featureId != null && !!pendingMapDrawIds[featureId];
        var SmID = featureId != null ? mapDrawSmIDs[featureId] : null;
        if (featureId != null) {
          delete pendingMapDrawIds[featureId];
          delete mapDrawSmIDs[featureId];
        }
        if (wasPending && SmID == null) {
          refreshDrawActions();
          return;
        }
        deleteUploadedFeature(feature, SmID);
      }

      function deleteServerFeature(datasetPath, SmID) {
        var normalizedSmID = SmID !== '' && SmID != null && !isNaN(SmID) ? Number(SmID) : SmID;
        var editFeaturesParams = new mapboxgl.supermap.EditFeaturesParameters({
          dataSourceName: decodeURIComponent(datasetPath[2]),
          dataSetName: decodeURIComponent(datasetPath[3]),
          IDs: [normalizedSmID],
          editType: 'delete'
        });
        new mapboxgl.supermap.FeatureService(datasetPath[1])
          .editFeatures(editFeaturesParams)
          .then(function (deleteResult) {
            var result = deleteResult && deleteResult.result;
            if (!result || result.succeed === false) {
              console.error(resources.text_videoMapDraw_deleteFailed, result);
              return;
            }
            refreshUploadedDataset(decodeURIComponent(datasetPath[3]));
          })
          .catch(function (error) {
            console.error(resources.text_videoMapDraw_deleteFailed, error);
          });
      }

      function updateMeasurementMarkers(prefix, targetMap, featureCollection, projectToVideo) {
        if (!targetMap || !featureCollection) {
          return;
        }
        var active = {};
        (featureCollection.features || []).forEach(function (feature, index) {
          var measurement = getMeasurement(feature);
          if (!measurement) {
            return;
          }
          var id = prefix + ':' + (feature.id == null ? index : feature.id);
          active[id] = true;
          var marker = measurementMarkers[id];
          if (!marker) {
            var element = document.createElement('div');
            element.className = 'measurement-marker';
            marker = new mapboxgl.Marker({ element: element });
            measurementMarkers[id] = marker;
          }
          var position = measurement.position;
          if (projectToVideo) {
            if (!videoMap || !videoMap.toVideoMapCoordinate) {
              return;
            }
            position = videoMap.toVideoMapCoordinate(proj4('EPSG:4326', 'EPSG:3857', position));
          }
          if (!position) {
            return;
          }
          marker.getElement().textContent = measurement.label;
          marker.setLngLat(position).addTo(targetMap);
        });
        Object.keys(measurementMarkers).forEach(function (id) {
          if (id.indexOf(prefix + ':') === 0 && !active[id]) {
            measurementMarkers[id].remove();
            delete measurementMarkers[id];
          }
        });
      }

      function getMeasurement(feature) {
        if (!feature.geometry) {
          return null;
        }
        if (feature.geometry.type === 'LineString') {
          var length = turf.length(feature, { units: 'meters' });
          var midpoint = turf.along(feature, length / 2, { units: 'meters' });
          return { position: midpoint.geometry.coordinates, label: resources.text_huainanDraw_length + ' ' + formatDistance(length) };
        }
        if (feature.geometry.type === 'Polygon') {
          var center = turf.center(feature);
          return { position: center.geometry.coordinates, label: resources.text_huainanDraw_area + ' ' + formatArea(turf.area(feature)) };
        }
        return null;
      }

      function formatDistance(meters) {
        return meters >= 1000 ? (meters / 1000).toFixed(2) + ' km' : meters.toFixed(2) + ' m';
      }

      function formatArea(squareMeters) {
        return squareMeters >= 1000000
          ? (squareMeters / 1000000).toFixed(2) + ' km²'
          : squareMeters.toFixed(2) + ' m²';
      }

      function createVideoMap() {
        queryFeatures('video').then(function (serviceResult) {
          var feature = serviceResult.result.features.features[0];
          var parameterList = feature.properties.videoParameters && feature.properties.videoParameters.videoParameterList;
          if (!parameterList || !parameterList.length) {
            return;
          }
          var parameters = parameterList.map(function (item) {
            var calibration = item.calibrationModel;
            var camera = calibration.cameraLocation;
            return {
              time: item.time,
              fovX: calibration.fovX,
              fovY: calibration.fovY,
              centerX: calibration.centerX,
              centerY: calibration.centerY,
              pitch: camera.cameraPitch,
              roll: camera.cameraRoll,
              yaw: camera.cameraYaw,
              x: camera.cameraX,
              y: camera.cameraY,
              z: camera.cameraZ
            };
          });
          var initialCenter = proj4('EPSG:3857', 'EPSG:4326', [parameters[0].x, parameters[0].y]);
          map.jumpTo({ center: initialCenter, zoom: 16, bearing: mapBearing });
          videoMap = new mapboxgl.supermap.VideoMap({
            container: 'videoMap',
            url: feature.properties.address,
            videoParameters: parameters,
            interval: 0.1
          });
          videoMap.addControl(new mapboxgl.supermap.VideoPlayControl(), 'bottom-left');
          videoMap.addControl(new mapboxgl.supermap.VideoMapDrawControl(), 'top-left');
          videoMap.on('load', function () {
            videoMap.addSource(VIDEO_DRAW_SOURCE_ID, {
              type: 'geojson',
              data: { type: 'FeatureCollection', features: [] }
            });
            videoMap.addLayer({
              id: 'video-draw-fill',
              type: 'fill',
              source: VIDEO_DRAW_SOURCE_ID,
              filter: ['==', '$type', 'Polygon'],
              paint: { 'fill-color': '#ff5a36', 'fill-opacity': 0.2 }
            });
            videoMap.addLayer({
              id: 'video-draw-line',
              type: 'line',
              source: VIDEO_DRAW_SOURCE_ID,
              filter: ['in', '$type', 'LineString', 'Polygon'],
              paint: { 'line-color': '#ff5a36', 'line-width': 3 }
            });
            videoMap.addLayer({
              id: 'video-draw-point',
              type: 'circle',
              source: VIDEO_DRAW_SOURCE_ID,
              filter: ['==', '$type', 'Point'],
              paint: { 'circle-radius': 5, 'circle-color': '#ff5a36', 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' }
            });
            videoMap.addSource(REAL_VIDEO_DRAW_SOURCE_ID, {
              type: 'geojson',
              data: { type: 'FeatureCollection', features: [] }
            });
            videoMap.addLayer({
              id: 'real-draw-fill',
              type: 'fill',
              source: REAL_VIDEO_DRAW_SOURCE_ID,
              filter: ['==', '$type', 'Polygon'],
              paint: { 'fill-color': '#168aad', 'fill-opacity': 0.25 }
            });
            videoMap.addLayer({
              id: 'real-draw-line',
              type: 'line',
              source: REAL_VIDEO_DRAW_SOURCE_ID,
              filter: ['in', '$type', 'LineString', 'Polygon'],
              paint: { 'line-color': '#168aad', 'line-width': 3 }
            });
            videoMap.addLayer({
              id: 'real-draw-point',
              type: 'circle',
              source: REAL_VIDEO_DRAW_SOURCE_ID,
              filter: ['==', '$type', 'Point'],
              paint: { 'circle-radius': 5, 'circle-color': '#168aad', 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' }
            });
            syncMapDraw();
            videoMap.on('drawupdate', function (event) {
              syncVideoDraw(event.live || event.data);
            });
            videoMap.on('drawcreate', function (event) {
              syncVideoDraw(event.data || videoMap.getDrawData());
              var createdFeature = videoMap.getDrawSelected().features[0] || event.feature;
              if (createdFeature && createdFeature.id != null) {
                pendingVideoDrawIds[createdFeature.id] = true;
              }
              refreshDrawActions();
            });
            videoMap.on('drawdelete', function (event) {
              syncVideoDraw(event.data || videoMap.getDrawData());
              (event.features || []).forEach(function (feature) {
                deleteUploadedFeature(feature);
              });
            });
            videoMap.on('drawclear', function () {
              syncVideoDraw({ type: 'FeatureCollection', features: [] });
              pendingVideoDrawIds = {};
              refreshDrawActions();
            });
            videoMap.on('videoparameterupdate', function () {
              updateMeasurementMarkers('video', videoMap, mapDraw.getAll(), true);
              updateMeasurementMarkers('video-draw-video', videoMap, videoMap.getDrawData(), true);
              updateVideoBounds();
            });
            updateVideoBounds();
            videoMap.on('mousemove', function (event) {
              var hits = dynamicLayerIds.length
                ? videoMap.queryRenderedFeatures(event.point, { layers: dynamicLayerIds })
                : [];
              videoMap.getCanvas().style.cursor = hits.length ? 'pointer' : '';
            });
            ['roads'].forEach(addVectorDataset);
            ['NewPoint', 'NewLine', 'NewRegion'].forEach(refreshUploadedDataset);
          });
        });
      }

      function resizeMaps() {
        if (videoMap && videoMap.resize) {
          videoMap.resize();
        }
        if (map) {
          map.resize();
        }
      }

      initMap();
      createVideoMap();
      window.addEventListener('resize', resizeMaps);
    </script>
  </body>
</html>
