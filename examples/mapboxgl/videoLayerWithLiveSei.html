<!--********************************************************************
* 该示例需要引入
* mapbox-gl-enhance (https://iclient.supermap.io/web/libs/mapbox-gl-js-enhance/1.12.1-13/mapbox-gl-enhance.js)
* Turf (https://github.com/Turfjs/turf/)
* proj4js (https://github.com/proj4js/proj4js)
* video.js (https://github.com/videojs/video.js)
* opencv (https://github.com/opencv/opencv)
*********************************************************************-->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="resources.title_videoLayerWithLiveSei"></title>
    <style>
      body { margin: 0; padding: 0; }
      #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="text/javascript" include="bootstrap" src="../js/include-web.js"></script>
    <script type="text/javascript" include="mapbox-gl-enhance,proj4,turf,videojs,hls,opencv" src="../../dist/mapboxgl/include-mapboxgl.js"></script>
    <!--
      hls.js 和 video.js 一样是固定的外部库，由 include 列表引入（全局 Hls），iClient 内部固定使用该版本：
      SEI + m3u8 时 iClient 会自行创建 hls 实例、挂载 <video>、loadSource 并监听 FRAG_PARSING_USERDATA，
      业务只传 url + parametersSource:'SEI' 即可，不需要传 hls 实例、hlsFactory 或 hlsCtor。
    -->
    <script type="text/javascript">
      (function () {
        'use strict';

        // 播放地址来自 iServer 数据服务：数据集记录的 address 属性就是服务端转出的 HLS(m3u8) 地址
        // 对应 REST 地址：http://10.10.4.202:8090/iserver/services/data-demo/rest/data/datasources/VideoData/datasets/DJI_09304
        var DATA_URL = 'http://10.10.4.202:8090/iserver/services/data-demo/rest/data';
        var DATASOURCE_NAME = 'VideoData';
        var DATASET_NAME = 'DJI_09304';
        // 手工指定的播放地址，留空表示从数据服务的 address 属性取
        var STREAM_ADDRESS = '';

        var map = null;
        var videoLayer = null;
        var streamAddress = '';

        function toLngLat(coord) {
          return window.proj4 ? proj4('EPSG:3857', 'EPSG:4326', coord) : coord;
        }

        // 视频数据集里一条记录就是一路流：address 是服务端转出的 HLS(m3u8) 地址，
        // 相机参数和裁剪范围都来自分片 SEI，这里只取播放地址。
        function queryStreamAddress() {
          if (STREAM_ADDRESS) {
            return Promise.resolve(STREAM_ADDRESS);
          }
          var sqlParam = new mapboxgl.supermap.GetFeaturesBySQLParameters({
            queryParameter: {
              name: DATASET_NAME + '@' + DATASOURCE_NAME,
              attributeFilter: 'SMID > 0'
            },
            datasetNames: [DATASOURCE_NAME + ':' + DATASET_NAME]
          });
          return new mapboxgl.supermap.FeatureService(DATA_URL)
            .getFeaturesBySQL(sqlParam)
            .then(function (serviceResult) {
              var collection = serviceResult && serviceResult.result && serviceResult.result.features;
              var features = collection && (collection.features || (Array.isArray(collection) ? collection : null));
              if (!features || !features.length) {
                throw new Error('数据集 ' + DATASET_NAME + '@' + DATASOURCE_NAME + ' 中没有视频记录');
              }
              for (var i = features.length - 1; i >= 0; i--) {
                var address = features[i].properties && features[i].properties.address;
                if (address && /\.m3u8(\?|#|$)/i.test(address)) {
                  return address;
                }
              }
              throw new Error('视频记录的 address 属性不是 .m3u8 地址');
            });
        }

        function connect() {
          queryStreamAddress().then(
            function (address) {
              streamAddress = address;
              createVideoLayer();
            },
            function (error) {
              console.error('[SEI] 获取播放地址失败', error);
            }
          );
        }

        // url 在创建 VideoLayer 时传入即可：SEI + m3u8 场景下 iClient 用页面引入的 hls.js（全局 Hls）自行接管，
        // attachMedia、loadSource、hlsFragParsingUserdata / hlsFragBuffered 监听、致命错误重连都在内部完成。
        // 浏览器 MSE 能力、hls.js 是否可用也由 iClient 内部检测，业务侧不需要重复判断。

        function locateToCamera() {
          var timeline = videoLayer && videoLayer.getSeiTimeline();
          var head = timeline && timeline.firstPoses(1);
          if (!head || !head.length) {
            return;
          }
          var lngLat = toLngLat([head[0].x, head[0].y]);
          map.easeTo({ center: lngLat, zoom: Math.max(map.getZoom(), 17) });
        }

        function createVideoLayer() {
          videoLayer = new mapboxgl.supermap.VideoLayer({
            url: streamAddress,
            parametersSource: 'SEI',
            loop: false
          });

          // 首次配准后定位一次，后续播放不改变用户的地图视角。
          videoLayer.once('parametersready', function () {
            setTimeout(locateToCamera, 0);
          });

          // 内部 hls.js 报错，致命错误已由 iClient 自动重连
          videoLayer.on('seistreamerror', function (e) {
            if (!e || !e.fatal) {
              return;
            }
            console.error('[SEI] hls.js 致命错误', e);
          });

          videoLayer.on('seiinvalid', function (e) {
            console.warn('[SEI] 解析失败', e.reason, e.sample);
          });

          map.addLayer(videoLayer);
          map.addControl(new mapboxgl.supermap.VideoPlayControl({ target: videoLayer }), 'bottom-left');
        }

        function createMap() {
          map = new mapboxgl.Map({
            container: 'map',
            renderWorldCopies: false,
            style: {
              version: 8,
              sources: {
                'raster-tiles': {
                  type: 'raster',
                  tileSize: 256,
                  // 天地图影像最高原生级别为 18，继续放大时复用该级瓦片。
                  maxzoom: 18,
                  tiles: [
                    'https://t4.tianditu.gov.cn/img_w/wmts?service=WMTS&request=GetTile&version=1.0.0&style=default&tilematrixSet=w&format=tiles&width=256&height=256&layer=img&tilematrix={z}&tilerow={y}&tilecol={x}&tk=1d109683f4d84198e37a38c442d68311'
                  ]
                }
              },
              layers: [
                {
                  id: 'simple-tiles',
                  type: 'raster',
                  source: 'raster-tiles',
                  minzoom: 0,
                  maxzoom: 22
                }
              ]
            },
            center: [121.2595, 31.3368],
            zoom: 17
          });
          map.addControl(new mapboxgl.NavigationControl(), 'top-left');
          map.addControl(new mapboxgl.supermap.LogoControl({ link: 'https://iclient.supermap.io' }), 'bottom-right');
        }

        window.addEventListener('beforeunload', function () {
          if (videoLayer && map) {
            // 移除图层会销毁 iClient 托管的 hls.js 实例
            map.removeLayer(videoLayer);
            videoLayer = null;
          }
        });

        function start() {
          if (!window.cv || !window.cv.Mat) {
            // opencv.js 由 include-mapboxgl.js 异步加载，就绪后才能创建 VideoLayer
            setTimeout(start, 200);
            return;
          }
          createMap();
          map.on('load', function () {
            connect();
          });
        }

        start();
      })();
    </script>
  </body>
</html>
