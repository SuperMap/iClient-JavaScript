<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title data-i18n="resources.title_videoMapWithTimeDraw"></title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #layout {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
      }

      #leftPane,
      #rightPane {
        position: relative;
        width: 50%;
        height: 100%;
      }

      #leftPane {
        border-right: 1px solid #d9d9d9;
      }

      #videoMap,
      #map {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }

      .pane-label {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 11;
        padding: 4px 10px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        border-radius: 4px;
        font-size: 13px;
        pointer-events: none;
      }

      #drawActions {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 12;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 32px);
        padding: 8px 10px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-size: 13px;
      }

      #drawActions button {
        padding: 4px 16px;
        border: 1px solid #1677ff;
        border-radius: 3px;
        background: #1677ff;
        color: #fff;
        font-size: 13px;
        line-height: 20px;
        cursor: pointer;
      }

      #drawActions button:disabled {
        border-color: #d9d9d9;
        background: #f5f5f5;
        color: rgba(0, 0, 0, 0.25);
        cursor: not-allowed;
      }

      #drawActions .draw-status {
        color: rgba(0, 0, 0, 0.65);
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="leftPane">
        <div class="pane-label" data-i18n="resources.text_videoMapDraw_videoLabel"></div>
        <div id="videoMap"></div>
        <div id="drawActions">
          <button id="saveDrawBtn" type="button" data-i18n="resources.text_videoMapDraw_save" disabled></button>
          <span id="drawStatus" class="draw-status"></span>
        </div>
      </div>
      <div id="rightPane">
        <div class="pane-label" data-i18n="resources.text_videoMapDraw_basemapLabel"></div>
        <div id="map"></div>
      </div>
    </div>
    <script type="text/javascript" include="bootstrap" src="../js/include-web.js"></script>
    <script
      type="text/javascript"
      include="mapbox-gl-enhance,draw,proj4,turf,videojs,opencv"
      src="../../dist/mapboxgl/include-mapboxgl.js"
    ></script>
    <script type="text/javascript">
      var host = 'https://iserver.supermap.io';
      var dataUrl = host + '/iserver/services/data-video/rest/data';
      var datasourceName = 'VideoData';
      var datasetName = 'DJI_09304';
      var uploadedDataUrl = host + '/iserver/services/data-edit/rest/data';
      var uploadedDatasourceName = 'edit';
      var dataSourceUrl = uploadedDataUrl + '/datasources/' + uploadedDatasourceName;
      var datasetUrl = {
        Point: dataSourceUrl + '/datasets/NewPoint',
        LineString: dataSourceUrl + '/datasets/NewLine',
        Polygon: dataSourceUrl + '/datasets/NewRegion'
      };
      var videoMap;
      var map;
      var uploadedDatasetData = {};
      var mapFitted = false;
      var mapBearing = 270;
      var videoExtents = [];
      var lastVideoExtentTime;
      var pendingDrawIds = {};
      var drawFeatureSmIDs = {};
      var savingDraw = false;
      var tk = '1d109683f4d84198e37a38c442d68311';
      var attribution =
        "© <a href='https://www.tianditu.gov.cn' target='_blank'>" + resources.title_3tianditu + "</a>" +
        " with <span>© <a href='https://iclient.supermap.io' target='_blank'>SuperMap iClient</a></span> ";

      initRealMap();
      query();

      function initRealMap() {
        map = new mapboxgl.Map({
          container: 'map',
          style: {
            version: 8,
            sources: {
              tianditu_img: {
                attribution: attribution,
                type: 'raster',
                tiles: ['https://t4.tianditu.gov.cn/img_w/wmts?tk=' + tk + '&service=WMTS&request=GetTile&version=1.0.0&style=default&tilematrixSet=w&format=tiles&width=256&height=256&layer=img&tilematrix={z}&tilerow={y}&tilecol={x}'],
                tileSize: 256
              },
              tianditu_cia: {
                type: 'raster',
                tiles: ['https://t4.tianditu.gov.cn/cia_w/wmts?tk=' + tk + '&service=WMTS&request=GetTile&version=1.0.0&style=default&tilematrixSet=w&format=tiles&width=256&height=256&layer=cia&tilematrix={z}&tilerow={y}&tilecol={x}'],
                tileSize: 256
              }
            },
            layers: [
              {
                id: 'tianditu-img',
                type: 'raster',
                source: 'tianditu_img',
                minzoom: 0,
                maxzoom: 18
              },
              {
                id: 'tianditu-cia',
                type: 'raster',
                source: 'tianditu_cia',
                minzoom: 0,
                maxzoom: 18
              }
            ]
          },
          center: [104.0924, 30.5217],
          zoom: 17,
          bearing: mapBearing,
          maxZoom: 18
        });
        map.addControl(new mapboxgl.NavigationControl(), 'top-left');
        map.addControl(new mapboxgl.supermap.LogoControl({ link: 'https://iclient.supermap.io' }), 'bottom-right');
        map.on('load', function () {
          map.addSource('draw-sync', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
          });
          map.addLayer({
            id: 'draw-sync-fill',
            type: 'fill',
            source: 'draw-sync',
            filter: ['==', '$type', 'Polygon'],
            paint: {
              'fill-color': '#52c41a',
              'fill-opacity': 0.25
            }
          });
          map.addLayer({
            id: 'draw-sync-line',
            type: 'line',
            source: 'draw-sync',
            filter: ['in', '$type', 'LineString', 'Polygon'],
            paint: {
              'line-color': '#52c41a',
              'line-width': 2
            }
          });
          map.addLayer({
            id: 'draw-sync-point',
            type: 'circle',
            source: 'draw-sync',
            filter: ['==', '$type', 'Point'],
            paint: {
              'circle-radius': 5,
              'circle-color': '#52c41a',
              'circle-stroke-width': 1,
              'circle-stroke-color': '#fff'
            }
          });
          map.addSource('video-bounds', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
          });
          map.addLayer({
            id: 'video-bounds-fill',
            type: 'fill',
            source: 'video-bounds',
            paint: {
              'fill-color': '#fbb03b',
              'fill-opacity': 0.08
            }
          });
          map.addLayer({
            id: 'video-bounds-line',
            type: 'line',
            source: 'video-bounds',
            paint: {
              'line-color': '#fbb03b',
              'line-width': 2,
              'line-dasharray': [2, 1]
            }
          });
          if (videoMap && videoMap.getDrawLiveData) {
            syncRealMap(videoMap.getDrawLiveData());
          }
          syncVideoBounds();
        });
      }

      function query() {
        var sqlParam = new mapboxgl.supermap.GetFeaturesBySQLParameters({
          queryParameter: {
            name: datasetName + '@' + datasourceName,
            attributeFilter: 'SMID > 0'
          },
          datasetNames: [datasourceName + ':' + datasetName]
        });

        new mapboxgl.supermap.FeatureService(dataUrl).getFeaturesBySQL(sqlParam).then(function (serviceResult) {
          var feature = serviceResult.result.features.features[0];
          var parameters = feature.properties.videoParameters.videoParameterList.map(function (item) {
            var calibration = item.calibrationModel;
            var camera = calibration.cameraLocation;
            var extent = item.extent && item.extent.points
              ? item.extent.points.map(function (point) {
                  var coordinate = Array.isArray(point) ? point : [point.x, point.y];
                  return proj4('EPSG:3857', 'EPSG:4326', coordinate);
                })
              : null;
            if (extent && extent.length >= 3) {
              videoExtents.push({ time: item.time, coordinates: extent });
            }
            return {
              time: item.time,
              fovX: calibration.fovX,
              fovY: calibration.fovY,
              centerX: calibration.centerX,
              centerY: calibration.centerY,
              pitch: camera.cameraPitch,
              roll: camera.cameraRoll,
              yaw: camera.cameraYaw,
              x: camera.cameraX,
              y: camera.cameraY,
              z: camera.cameraZ
            };
          });
          if (parameters.length && map) {
            var cameraLngLat = proj4('EPSG:3857', 'EPSG:4326', [parameters[0].x, parameters[0].y]);
            map.jumpTo({ center: cameraLngLat, zoom: 17, bearing: mapBearing });
          }
          videoMap = new mapboxgl.supermap.VideoMap({
            container: 'videoMap',
            url: feature.properties.address,
            videoParameters: parameters,
            interval: 0.1
          });
          videoMap.addControl(new mapboxgl.supermap.VideoPlayControl(), 'bottom-left');
          videoMap.addControl(new mapboxgl.supermap.VideoMapDrawControl(), 'top-left');
          videoMap.on('load', function () {
            syncVideoBounds();
            fitVideoBounds();
            videoMap.on('videoparameterupdate', function () {
              syncVideoBounds(videoMap.currentTime);
            });
            videoMap.on('drawupdate', function (e) {
              syncRealMap(e.live);
            });
            videoMap.on('drawcreate', function (e) {
              fitRealMap(e.data);
              var createdFeature = getCreatedFeature(e);
              if (createdFeature && createdFeature.id != null) {
                pendingDrawIds[createdFeature.id] = true;
              }
              refreshDrawActions();
            });
            videoMap.on('drawdelete', function (e) {
              (e.features || []).forEach(deleteUploadedFeature);
              refreshDrawActions();
            });
            videoMap.on('drawclear', function () {
              mapFitted = false;
              pendingDrawIds = {};
              drawFeatureSmIDs = {};
              refreshDrawActions();
            });
            ['NewPoint', 'NewLine', 'NewRegion'].forEach(function (dataset) {
              loadUploadedDataset(dataset);
            });
            bindSaveButton();
            resizeMaps();
          });
        });
      }

      function syncRealMap(featureCollection) {
        if (!map || !map.getSource('draw-sync') || !featureCollection) {
          return;
        }
        map.getSource('draw-sync').setData(featureCollection);
        if (!mapFitted && featureCollection.features && featureCollection.features.length) {
          fitRealMap(featureCollection);
        }
      }

      function syncVideoBounds(time) {
        if (!map || !map.getSource('video-bounds') || !videoMap || !videoMap.getVideoBounds) {
          return;
        }
        var extent = getVideoExtent(time);
        if (extent) {
          map.getSource('video-bounds').setData({
            type: 'Feature',
            properties: { source: 'server-extent' },
            geometry: {
              type: 'Polygon',
              coordinates: [closeRing(extent.coordinates)]
            }
          });
          return;
        }
        var feature = videoMap.getVideoBounds();
        map.getSource('video-bounds').setData(
          feature || { type: 'FeatureCollection', features: [] }
        );
      }

      function getVideoExtent(time) {
        if (!videoExtents.length) {
          return null;
        }
        var target = typeof time === 'number' ? time : videoExtents[0].time;
        var nearest = videoExtents[0];
        var nearestDistance = Math.abs((nearest.time || 0) - target);
        videoExtents.forEach(function (item) {
          var distance = Math.abs((item.time || 0) - target);
          if (distance < nearestDistance) {
            nearest = item;
            nearestDistance = distance;
          }
        });
        if (nearest.time === lastVideoExtentTime) {
          return nearest;
        }
        lastVideoExtentTime = nearest.time;
        return nearest;
      }

      function closeRing(coordinates) {
        if (!coordinates || !coordinates.length) {
          return [];
        }
        var ring = coordinates.slice();
        var first = ring[0];
        var last = ring[ring.length - 1];
        if (!last || first[0] !== last[0] || first[1] !== last[1]) {
          ring.push(first.slice());
        }
        return ring;
      }

      function resolveDatasetPath(feature) {
        if (!feature || !feature.geometry) {
          return null;
        }
        var targetUrl = datasetUrl[feature.geometry.type];
        if (!targetUrl) {
          return null;
        }
        return targetUrl.match(/^(.*)\/datasources\/([^/]+)\/datasets\/([^/?#]+)\/?$/);
      }

      function getDatasetName(feature) {
        var datasetPath = resolveDatasetPath(feature);
        return datasetPath ? decodeURIComponent(datasetPath[3]) : '';
      }

      function getDrawFeatures() {
        return videoMap && videoMap.getDrawData ? videoMap.getDrawData().features || [] : [];
      }

      function getCreatedFeature(event) {
        if (videoMap && videoMap.getDrawSelected) {
          var selected = videoMap.getDrawSelected();
          if (selected && selected.features && selected.features.length) {
            return selected.features[0];
          }
        }
        var features = (event && event.data && event.data.features) || [];
        return features.length ? features[features.length - 1] : null;
      }

      function isDrawFeatureSaved(feature) {
        return !!feature && getFeatureSmID(feature) != null;
      }

      function getFeatureSmID(feature) {
        if (!feature) {
          return null;
        }
        var properties = feature.properties || {};
        if (properties.SmID != null) {
          return properties.SmID;
        }
        if (properties.SMID != null) {
          return properties.SMID;
        }
        return feature.id != null && drawFeatureSmIDs[feature.id] != null ? drawFeatureSmIDs[feature.id] : null;
      }

      function rememberFeatureSmID(feature, SmID) {
        if (!feature || feature.id == null || SmID == null) {
          return;
        }
        drawFeatureSmIDs[feature.id] = SmID;
        feature.properties = feature.properties || {};
        feature.properties.SmID = SmID;
      }

      function getPendingDrawFeatures() {
        return getDrawFeatures().filter(function (feature) {
          return !!feature && feature.id != null && !!pendingDrawIds[feature.id] && !isDrawFeatureSaved(feature);
        });
      }

      function refreshDrawActions() {
        var button = document.getElementById('saveDrawBtn');
        var status = document.getElementById('drawStatus');
        if (!button || !status) {
          return;
        }
        var pendingCount = getPendingDrawFeatures().length;
        button.disabled = savingDraw || !pendingCount;
        if (savingDraw) {
          status.textContent = resources.text_videoMapDraw_saving;
          return;
        }
        status.textContent = pendingCount
          ? resources.text_videoMapDraw_pending.replace('{count}', pendingCount)
          : resources.text_videoMapDraw_saveHint;
      }

      function bindSaveButton() {
        var button = document.getElementById('saveDrawBtn');
        if (button) {
          button.addEventListener('click', saveDrawFeatures);
        }
        refreshDrawActions();
      }

      function saveDrawFeatures() {
        if (savingDraw) {
          return;
        }
        var pendingFeatures = getPendingDrawFeatures();
        if (!pendingFeatures.length) {
          return;
        }
        savingDraw = true;
        refreshDrawActions();
        var uploadedByDataset = {};
        var chain = Promise.resolve();
        pendingFeatures.forEach(function (feature) {
          chain = chain.then(function () {
            return uploadDrawFeature(feature).then(function (uploaded) {
              if (!uploaded) {
                return;
              }
              delete pendingDrawIds[feature.id];
              var dataset = getDatasetName(feature);
              if (dataset) {
                (uploadedByDataset[dataset] = uploadedByDataset[dataset] || []).push(feature);
              }
              refreshDrawActions();
            });
          });
        });
        chain.then(function () {
          savingDraw = false;
          Object.keys(uploadedByDataset).forEach(function (dataset) {
            uploadedByDataset[dataset].forEach(function (feature) {
              cacheUploadedFeature(dataset, feature);
            });
            renderUploadedDataset(dataset);
          });
          refreshDrawActions();
        }).catch(function (error) {
          savingDraw = false;
          console.error(resources.text_videoMapDraw_saveFailed, error);
          refreshDrawActions();
        });
      }

      function toUploadFeature(feature) {
        return {
          type: 'Feature',
          properties: {},
          geometry: {
            type: feature.geometry.type,
            coordinates: JSON.parse(JSON.stringify(feature.geometry.coordinates))
          }
        };
      }

      function uploadDrawFeature(feature) {
        var datasetPath = resolveDatasetPath(feature);
        if (!datasetPath) {
          return Promise.resolve(false);
        }
        var editFeaturesParams = new mapboxgl.supermap.EditFeaturesParameters({
          features: [toUploadFeature(feature)],
          dataSourceName: decodeURIComponent(datasetPath[2]),
          dataSetName: decodeURIComponent(datasetPath[3]),
          editType: 'add',
          returnContent: true
        });
        return new mapboxgl.supermap.FeatureService(datasetPath[1])
          .editFeatures(editFeaturesParams)
          .then(function (serviceResult) {
            var result = serviceResult && serviceResult.result;
            if (!result || result.succeed === false) {
              console.error(resources.text_videoMapDraw_uploadFailed, result);
              return false;
            }
            var SmID = Array.isArray(result) ? result[0] : result.SmID != null ? result.SmID : null;
            if (SmID != null) {
              rememberFeatureSmID(feature, SmID);
              return true;
            }
            return findUploadedSmID(feature).then(function (serverSmID) {
              rememberFeatureSmID(feature, serverSmID);
              return true;
            });
          })
          .catch(function (error) {
            console.error(resources.text_videoMapDraw_uploadFailed, error);
            return false;
          });
      }

      function findUploadedSmID(feature) {
        var dataset = getDatasetName(feature);
        if (!dataset) {
          return Promise.resolve(null);
        }
        var sqlParam = new mapboxgl.supermap.GetFeaturesBySQLParameters({
          queryParameter: { name: dataset + '@' + uploadedDatasourceName },
          targetEpsgCode: '4326',
          datasetNames: [uploadedDatasourceName + ':' + dataset],
          toIndex: 99999
        });
        return new mapboxgl.supermap.FeatureService(uploadedDataUrl)
          .getFeaturesBySQL(sqlParam)
          .then(function (serviceResult) {
            var featureCollection = serviceResult && serviceResult.result && serviceResult.result.features;
            var target = JSON.stringify(feature.geometry);
            var serverFeature = ((featureCollection && featureCollection.features) || []).find(function (item) {
              return JSON.stringify(item.geometry) === target;
            });
            if (!serverFeature) {
              return null;
            }
            var properties = serverFeature.properties || {};
            return properties.SMID != null ? properties.SMID : serverFeature.id != null ? serverFeature.id : null;
          })
          .catch(function (error) {
            console.error(resources.text_videoMapDraw_findFailed, error);
            return null;
          });
      }

      function deleteUploadedFeature(feature) {
        if (!feature || feature.id == null) {
          return;
        }
        var wasPending = !!pendingDrawIds[feature.id];
        var recordedSmID = drawFeatureSmIDs[feature.id];
        delete pendingDrawIds[feature.id];
        delete drawFeatureSmIDs[feature.id];
        var datasetPath = resolveDatasetPath(feature);
        if (!datasetPath) {
          return;
        }
        var SmID = recordedSmID != null ? recordedSmID : getFeatureSmID(feature);
        if (SmID != null) {
          deleteServerFeature(datasetPath, SmID, feature.geometry);
          return;
        }
        if (wasPending) {
          return;
        }
        findUploadedSmID(feature).then(function (serverSmID) {
          if (serverSmID != null) {
            deleteServerFeature(datasetPath, serverSmID, feature.geometry);
          }
        });
      }

      function deleteServerFeature(datasetPath, SmID, geometry) {
        var dataset = decodeURIComponent(datasetPath[3]);
        var normalizedSmID = SmID !== '' && SmID != null && !isNaN(SmID) ? Number(SmID) : SmID;
        var editFeaturesParams = new mapboxgl.supermap.EditFeaturesParameters({
          dataSourceName: decodeURIComponent(datasetPath[2]),
          dataSetName: dataset,
          IDs: [normalizedSmID],
          editType: 'delete'
        });
        new mapboxgl.supermap.FeatureService(datasetPath[1])
          .editFeatures(editFeaturesParams)
          .then(function (deleteResult) {
            var result = deleteResult && deleteResult.result;
            if (result && result.succeed === false) {
              console.error(resources.text_videoMapDraw_deleteFailed, result);
              return;
            }
            removeUploadedFeature(dataset, normalizedSmID, geometry);
          })
          .catch(function (error) {
            console.error(resources.text_videoMapDraw_deleteFailed, error);
          });
      }

      function loadUploadedDataset(dataset) {
        var sqlParam = new mapboxgl.supermap.GetFeaturesBySQLParameters({
          queryParameter: { name: dataset + '@' + uploadedDatasourceName },
          targetEpsgCode: '4326',
          datasetNames: [uploadedDatasourceName + ':' + dataset],
          toIndex: 99999
        });
        new mapboxgl.supermap.FeatureService(uploadedDataUrl).getFeaturesBySQL(sqlParam).then(function (serviceResult) {
          var featureCollection = serviceResult && serviceResult.result && serviceResult.result.features;
          if (!featureCollection || !Array.isArray(featureCollection.features)) {
            return;
          }
          uploadedDatasetData[dataset] = {
            type: 'FeatureCollection',
            features: featureCollection.features
          };
          renderUploadedDataset(dataset);
        }).catch(function (error) {
          console.error(resources.text_videoMapDraw_loadUploadedFailed, error);
        });
      }

      function cacheUploadedFeature(dataset, feature) {
        if (!dataset || !feature || !feature.geometry) {
          return;
        }
        if (!uploadedDatasetData[dataset]) {
          uploadedDatasetData[dataset] = { type: 'FeatureCollection', features: [] };
        }
        var features = uploadedDatasetData[dataset].features;
        var SmID = getFeatureSmID(feature);
        if (features.some(function (item) {
          return isSameUploadedFeature(item, SmID, feature.geometry);
        })) {
          return;
        }
        var properties = {};
        if (SmID != null) {
          properties.SMID = SmID;
        }
        features.push({
          type: 'Feature',
          properties: properties,
          geometry: JSON.parse(JSON.stringify(feature.geometry))
        });
      }

      function removeUploadedFeature(dataset, SmID, geometry) {
        var data = uploadedDatasetData[dataset];
        if (!data) {
          return;
        }
        var index = data.features.findIndex(function (item) {
          return isSameUploadedFeature(item, SmID, geometry);
        });
        if (index === -1) {
          return;
        }
        data.features.splice(index, 1);
        renderUploadedDataset(dataset);
      }

      function isSameUploadedFeature(item, SmID, geometry) {
        if (!item) {
          return false;
        }
        if (SmID != null) {
          var properties = item.properties || {};
          if (properties.SMID != null && String(properties.SMID) === String(SmID)) {
            return true;
          }
          if (item.id != null && String(item.id) === String(SmID)) {
            return true;
          }
        }
        return !!geometry && JSON.stringify(item.geometry) === JSON.stringify(geometry);
      }

      function renderUploadedDataset(dataset) {
        var data = uploadedDatasetData[dataset];
        if (!data) {
          return;
        }
        syncUploadedDatasetToVideoMap(dataset, data);
        syncUploadedDatasetToRealMap(dataset, data);
      }

      function syncUploadedDatasetToRealMap(dataset, data) {
        if (!map || !map.getSource || !data) {
          return;
        }
        var sourceId = 'uploaded-draw-' + dataset;
        var source = map.getSource(sourceId);
        if (source) {
          source.setData(data);
          return;
        }
        map.addSource(sourceId, { type: 'geojson', data: data });
        map.addLayer({
          id: sourceId + '-fill',
          type: 'fill',
          source: sourceId,
          filter: ['==', '$type', 'Polygon'],
          paint: { 'fill-color': '#52c41a', 'fill-opacity': 0.2 }
        });
        map.addLayer({
          id: sourceId + '-line',
          type: 'line',
          source: sourceId,
          filter: ['in', '$type', 'LineString', 'Polygon'],
          paint: { 'line-color': '#52c41a', 'line-width': 3 }
        });
        map.addLayer({
          id: sourceId + '-point',
          type: 'circle',
          source: sourceId,
          filter: ['==', '$type', 'Point'],
          paint: { 'circle-radius': 5, 'circle-color': '#52c41a', 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' }
        });
      }

      function syncUploadedDatasetToVideoMap(dataset, data) {
        if (!videoMap || !videoMap.map || !data) {
          return;
        }
        var sourceId = 'uploaded-draw-' + dataset;
        var source = videoMap.getSource(sourceId);
        if (source) {
          source.setData(data);
          return;
        }
        videoMap.addSource(sourceId, { type: 'geojson', data: data });
        videoMap.addLayer({
          id: sourceId + '-fill',
          type: 'fill',
          source: sourceId,
          filter: ['==', '$type', 'Polygon'],
          paint: { 'fill-color': '#52c41a', 'fill-opacity': 0.2 }
        });
        videoMap.addLayer({
          id: sourceId + '-line',
          type: 'line',
          source: sourceId,
          filter: ['in', '$type', 'LineString', 'Polygon'],
          paint: { 'line-color': '#52c41a', 'line-width': 3 }
        });
        videoMap.addLayer({
          id: sourceId + '-point',
          type: 'circle',
          source: sourceId,
          filter: ['==', '$type', 'Point'],
          paint: { 'circle-radius': 5, 'circle-color': '#52c41a', 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' }
        });
      }

      function fitVideoBounds() {
        if (!map || !videoMap || !videoMap.getVideoBounds) {
          return;
        }
        var videoBounds = videoMap.getVideoBounds();
        if (!videoBounds) {
          return;
        }
        var mapBounds = turf.bbox(videoBounds);
        map.fitBounds([[mapBounds[0], mapBounds[1]], [mapBounds[2], mapBounds[3]]], {
          padding: 48,
          maxZoom: 17,
          bearing: mapBearing,
          duration: 600
        });
      }

      function fitRealMap(featureCollection) {
        var bounds = collectBounds(featureCollection);
        if (!bounds || !map) {
          return;
        }
        mapFitted = true;
        if (bounds[0][0] === bounds[1][0] && bounds[0][1] === bounds[1][1]) {
          map.flyTo({ center: bounds[0], zoom: 16, bearing: mapBearing });
          return;
        }
        map.fitBounds(bounds, { padding: 48, maxZoom: 17, bearing: mapBearing, duration: 600 });
        map.setBearing(mapBearing);
      }

      function collectBounds(featureCollection) {
        var lngLats = [];
        function walk(value) {
          if (!value) {
            return;
          }
          if (typeof value[0] === 'number' && typeof value[1] === 'number') {
            lngLats.push([value[0], value[1]]);
            return;
          }
          value.forEach(walk);
        }
        (featureCollection.features || []).forEach(function (feature) {
          if (feature.geometry && feature.geometry.coordinates) {
            walk(feature.geometry.coordinates);
          }
        });
        if (!lngLats.length) {
          return null;
        }
        var minLng = lngLats[0][0];
        var minLat = lngLats[0][1];
        var maxLng = minLng;
        var maxLat = minLat;
        lngLats.forEach(function (coord) {
          minLng = Math.min(minLng, coord[0]);
          minLat = Math.min(minLat, coord[1]);
          maxLng = Math.max(maxLng, coord[0]);
          maxLat = Math.max(maxLat, coord[1]);
        });
        return [
          [minLng, minLat],
          [maxLng, maxLat]
        ];
      }

      function resizeMaps() {
        if (videoMap && videoMap.resize) {
          videoMap.resize();
        }
        if (map && map.resize) {
          map.resize();
        }
      }

      window.addEventListener('resize', resizeMaps);
      window.addEventListener('load', refreshDrawActions);
    </script>
  </body>
</html>
