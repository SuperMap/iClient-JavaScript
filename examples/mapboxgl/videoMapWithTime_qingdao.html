<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="resources.title_videoMapWithTime_qingdao"></title>
    <style>
      body { margin: 0; padding: 0; }
      #map { position: absolute; top: 0; bottom: 0; width: 100%; }
      .mapboxgl-popup-content {
        box-sizing: border-box;
        width: 260px;
        max-height: 320px;
        padding: 28px 4px 12px 12px;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .feature-popup table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        table-layout: fixed;
      }
      .feature-popup td {
        padding: 2px 8px 2px 0;
        vertical-align: top;
        word-break: break-all;
      }
      .feature-popup td:first-child {
        width: 38%;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="text/javascript" include="bootstrap" src="../js/include-web.js"></script>
    <script type="text/javascript" include="mapbox-gl-enhance,proj4,turf,videojs,opencv" src="../../dist/mapboxgl/include-mapboxgl.js"></script>
    <script type="text/javascript">
      var dataUrl = 'http://172.16.14.44:8090/iserver/services/data-qingdao/rest/data';
      var videoMap;
      var count = 0;
      var dynamicLayerIds = [];

      function queryFeatures(datasetName, dataSourceName) {
        var sqlParam = new mapboxgl.supermap.GetFeaturesBySQLParameters({
          queryParameter: {
            name: datasetName + '@' + dataSourceName,
          },
          targetEpsgCode: '4326',
          datasetNames: [dataSourceName + ':' + datasetName],
          toIndex: 1000000,
          maxFeatures: 1000000,
        });
        return new mapboxgl.supermap.FeatureService(dataUrl).getFeaturesBySQL(sqlParam);
      }

      function addVectorDataset(datasetName) {
        queryFeatures(datasetName, 'qingdao').then(function (serviceResult) {
          var features = serviceResult.result.features;
          var sourceId = 'dynamic-source-' + count;
          var layerId = 'dynamic-layer-' + count;
          count++;
          videoMap.addSource(sourceId, { type: 'geojson', data: features });
          var type = features.features[0].geometry.type;
          var layer = {
            id: layerId,
            type: type === 'Point' ? 'circle' : type === 'LineString' ? 'line' : 'fill',
            source: sourceId,
            paint: type === 'Point'
              ? { 'circle-radius': 5, 'circle-color': '#ff5a36', 'circle-stroke-width': 1, 'circle-stroke-color': '#ffffff' }
              : type === 'LineString'
                ? { 'line-width': 4, 'line-color': '#ff9f1c' }
                : { 'fill-color': '#48cae4', 'fill-opacity': 0.55 }
          };
          videoMap.addLayer(layer);
          dynamicLayerIds.push(layerId);
          videoMap.on('click', function (e) {
            var features = videoMap.queryRenderedFeatures(e.point, { layers: [layerId] });
            if (!features.length) {
              return;
            }
            var feature = features[0];
            var properties = feature.properties;
            var html =
              '<div class="feature-popup">' +
              '<h4 style="margin:0 0 8px;font-size:13px;">' + datasetName + '</h4>' +
              '<table>';
            Object.keys(properties).forEach(function (key) {
              html +=
                '<tr>' +
                '<td>' + key + '</td>' +
                '<td>' + properties[key] + '</td>' +
                '</tr>';
            });
            html += '</table></div>';
            var popup = new mapboxgl.Popup({ closeButton: true, closeOnClick: true, maxWidth: '260px' })
              .setLngLat(e.lngLat)
              .setHTML(html)
              .addTo(videoMap);
          });
        });
      }

      function createVideoMap() {
        queryFeatures('video', 'qingdao').then(function (serviceResult) {
          var feature = serviceResult.result.features.features[0];
          var parameterList = feature.properties.videoParameters && feature.properties.videoParameters.videoParameterList;
          if (!parameterList || !parameterList.length) {
            return;
          }
          var parameters = parameterList.map(function (item) {
            var calibration = item.calibrationModel;
            var camera = calibration.cameraLocation;
            return {
              time: item.time,
              fovX: calibration.fovX,
              fovY: calibration.fovY,
              centerX: calibration.centerX,
              centerY: calibration.centerY,
              pitch: camera.cameraPitch,
              roll: camera.cameraRoll,
              yaw: camera.cameraYaw,
              x: camera.cameraX,
              y: camera.cameraY,
              z: camera.cameraZ
            };
          });
          videoMap = new mapboxgl.supermap.VideoMap({
            url: feature.properties.address,
            videoParameters: parameters,
            interval: 0.033
          });
          videoMap.on('load', function () { 
            videoMap.on('mousemove', function (e) {
              var features = videoMap.queryRenderedFeatures(e.point, { layers: dynamicLayerIds });
              videoMap.getCanvas().style.cursor = features.length ? 'pointer' : '';
            });
            videoMap.on('mouseout', function () {
              videoMap.getCanvas().style.cursor = '';
            });
            ['building', 'road', 'water'].forEach(addVectorDataset);
          });
        });
      }

      createVideoMap();
    </script>
  </body>
</html>
