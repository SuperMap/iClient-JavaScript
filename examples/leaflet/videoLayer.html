<!--********************************************************************

* Leaflet (https://iclient.supermap.io/web/libs/leaflet/1.9.4/leaflet.js)
* video.js (https://github.com/videojs/video.js)
* opencv (https://github.com/opencv/opencv)
*********************************************************************-->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="resources.title_videoLayer"></title>
    <style>
      body { margin: 0; padding: 0; }
      #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="text/javascript" include="bootstrap" src="../js/include-web.js"></script>
    <script type="text/javascript" src="https://iclient.supermap.io/web/libs/video-js/7.10.2/video.min.js"></script>
    <script type="text/javascript" src="https://iclient.supermap.io/web/libs/opencv/3.4/opencv.js"></script>
    <script type="text/javascript" src="../../dist/leaflet/include-leaflet.js"></script>
    <script type="text/javascript">
      var map, videoLayer;
      var dataUrl = 'https://iserver.supermap.io/iserver/services/data-video/rest/data';
      var datasourceName = 'VideoData';
      var datasetName = 'DJI_0937_2';
      // Leaflet 的世界像素基准为 256，zoom 加 1 与 MapboxGL 的 512 像素基准保持相同比例。
      map = L.map('map', { crs: L.CRS.EPSG3857 }).setView([30.529008613830903, 104.09380813215542], 15);
      L.tileLayer('https://t4.tianditu.gov.cn/img_w/wmts?service=WMTS&request=GetTile&version=1.0.0&style=default&tilematrixSet=w&format=tiles&width=256&height=256&layer=img&tilematrix={z}&tilerow={y}&tilecol={x}&tk=1d109683f4d84198e37a38c442d68311', {
        maxZoom: 19,
        // 天地图影像最高原生级别为 18，继续放大时复用该级瓦片。
        maxNativeZoom: 18,
        attribution: '© 天地图'
      }).addTo(map);
      map.on('click', function (e) {
        console.log('地图点击坐标（EPSG:3857）', e);
        console.log('地图点击坐标（EPSG:4326）', [e.latlng.lng, e.latlng.lat]);
      });

      function query() {
        var sqlParam = new L.supermap.GetFeaturesBySQLParameters({
          queryParameter: {
            name: datasetName + '@' + datasourceName,
            attributeFilter: 'SMID > 0'
          },
          datasetNames: [datasourceName + ':' + datasetName]
        });
        new L.supermap.FeatureService(dataUrl).getFeaturesBySQL(sqlParam).then(function (serviceResult) {
          var features = serviceResult.result && serviceResult.result.features && serviceResult.result.features.features;
          if (!features || !features.length) {
            throw new Error(serviceResult.error && serviceResult.error.errorMsg || '未返回视频记录');
          }
          var feature = features[0];
          var coordinates = feature.geometry.coordinates[0][0].map(function (coord) {
            var latlng = L.CRS.EPSG3857.unproject(L.point(coord[0], coord[1]));
            return [latlng.lng, latlng.lat];
          });
          var properties = feature.properties;
          var url = new URL(properties.address, dataUrl).href;
          var cameraLocation = properties.cameraLocation;
          var calibrationModel = properties.videoParameters.videoParameterList[0].calibrationModel;
          var clipRegionPoints = properties.videoParameters.videoParameterList[0].clipRegion.points;
          videoLayer = L.supermap.videoLayer({
            url: url,
            extent: [coordinates[3], coordinates[2], coordinates[1], coordinates[0]],
            videoParameters: {
              fovX: calibrationModel.fovX,
              fovY: calibrationModel.fovY,
              centerX: calibrationModel.centerX,
              centerY: calibrationModel.centerY,
              pitch: cameraLocation.cameraPitch,
              roll: cameraLocation.cameraRoll,
              yaw: cameraLocation.cameraYaw,
              x: cameraLocation.cameraX,
              y: cameraLocation.cameraY,
              z: cameraLocation.cameraZ
            },
            clipRegion: clipRegionPoints.slice(0, 4).map(function (point) { return [point.x, point.y]; })
          });
          videoLayer.on('error', function (e) { console.error(e.error); });
          videoLayer.addTo(map);
        }).catch(function (error) { console.error(error); });
      }

      map.whenReady(query);
    </script>
  </body>
</html>
