<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="resources.title_tiledMapLayer4326"></title>
    <script type="text/javascript" src="../../js/include-web.js" ></script>
    <script type="text/javascript" src="../../../dist/ol/include-ol.js" ></script>
  </head>
  <body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="width: 100%; height: 100%"></div>
    <script type="text/javascript">
      var host = window.isLocal ? window.server : "https://iserver.supermap.io";
      var url = host + "/iserver/services/map-World_en/rest/maps/World%20Map_VEC";

      // Method 1: 1. Call ol.supermap.initMap to create the map and base layer according to the map info from SuperMap iServer map service
      ol.supermap.initMap(url, {
        mapOptions: {
          // For ol v7+: ol.control.defaults.defaults; for ol v6 and below: ol.control.defaults
          controls: ol.control.defaults.defaults({ attributionOptions: { collapsed: false } })
            .extend([new ol.supermap.control.Logo({ link: "https://iclient.supermap.io" })])
        }
      });

      /*
      // Method 2: 1. Call ol.supermap.MapService to get the map info from SuperMap iServer map service
      //         2. Call ol.supermap.viewOptionsFromMapJSON to get the map view parameters
      //         3. Call ol.Map to create the map
      //         4. Call ol.layer.Tile and ol.source.TileSuperMapRest to create the base layer
      new ol.supermap.MapService(url).getMapInfo(function (serviceResult) {
        const mapObj = serviceResult.result;
        const viewOptions = ol.supermap.viewOptionsFromMapJSON(mapObj);
        map = new ol.Map({
          target: 'map',
          // For ol v7+: ol.control.defaults.defaults; for ol v6 and below: ol.control.defaults
          controls: ol.control.defaults.defaults({ attributionOptions: { collapsed: false } })
            .extend([new ol.supermap.control.Logo({ link: "https://iclient.supermap.io" })]),
          view: new ol.View(viewOptions)
        });
        var layer = new ol.layer.Tile({
          source: new ol.source.TileSuperMapRest(ol.source.TileSuperMapRest.optionsFromMapJSON(url, mapObj, true)),
          projection: 'EPSG:4326'
        });
        map.addLayer(layer);
        map.addControl(new ol.supermap.control.ScaleLine());
      });
      */
    </script>
  </body>
</html>
