<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="resources.title_tiledMapLayer3857"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
    <script type="text/javascript" src="../../../dist/ol/include-ol.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="width: 100%; height: 100%"></div>
    <script type="text/javascript">
      var map,
        url =
          (window.isLocal ? window.server : 'https://iserver.supermap.io') +
          '/iserver/services/map-World_en_3857/rest/maps/World%20Map_VEC_3857';
      // Method 1: ol.supermap.initMap - creates map and base layer based on iServer map info
      ol.supermap.initMap(url, {
        mapOptions: {
          // ol v7 uses ol.control.defaults.defaults; ol v6 and below uses ol.control.defaults
          controls: ol.control.defaults.defaults({ attributionOptions: { collapsed: false } })
            .extend([new ol.supermap.control.Logo({ link: "https://iclient.supermap.io" })])
        }
      });
      /* Method 2: 1.Use ol.supermap.MapService to get iServer map info
                2.Use ol.supermap.viewOptionsFromMapJSON to get view options
                3.Use ol.Map to create map
                4.Use ol.layer.Tile and ol.source.TileSuperMapRest to create base layer
      new ol.supermap.MapService(url).getMapInfo().then(function (serviceResult) {
        const mapObj = serviceResult.result;
        map = new ol.Map({
          target: 'map',
          // ol v7 uses ol.control.defaults.defaults; ol v6 and below uses ol.control.defaults
          controls: ol.control.defaults.defaults({ attributionOptions: { collapsed: false } })
            .extend([new ol.supermap.control.Logo({ link: "https://iclient.supermap.io" })]),
          view: new ol.View(ol.supermap.viewOptionsFromMapJSON(mapObj))
        });
        var layer = new ol.layer.Tile({
          source: new ol.source.TileSuperMapRest(ol.source.TileSuperMapRest.optionsFromMapJSON(url, mapObj, true))
        });
        map.addLayer(layer);
        map.addControl(new ol.supermap.control.ScaleLine());
      });
      */
    </script>
  </body>
</html>
