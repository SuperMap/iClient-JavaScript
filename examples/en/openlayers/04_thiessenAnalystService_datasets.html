<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_thiessenAnalystDataset"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
    <script type="text/javascript" src="../../../dist/ol/include-ol.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%; position: absolute;top: 0;">
<div id="map" style="width: 100%;height:100%"></div>
<script type="text/javascript">
    var map, options,
        host = (window.isLocal ? window.server : "https://iserver.supermap.io"),
        baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst";
    new ol.supermap.MapService(baseUrl).getMapInfo().then(function (serviceResult) {
        var mapJSONObj = serviceResult.result;
        map = new ol.Map({
            target: 'map',
            controls: ol.control.defaults.defaults({attributionOptions: {collapsed: false}})
                .extend([new ol.supermap.control.Logo({ link: "https://iclient.supermap.io" })]),
            view: new ol.View(ol.supermap.viewOptionsFromMapJSON(mapJSONObj))
        });
        options = ol.source.TileSuperMapRest.optionsFromMapJSON(baseUrl, mapJSONObj);
        var layer = new ol.layer.Tile({
            source: new ol.source.TileSuperMapRest(options)
        });
        map.addLayer(layer);

        // Zoom in and center on the Thiessen polygon area
        map.getView().setCenter(ol.proj.transform([-0.06, 51.50], 'EPSG:4326', map.getView().getProjection()));
        map.getView().setZoom(0);
        map.getView().setMaxZoom(18);

        thiessenAnalystProcess();
    });

    function thiessenAnalystProcess() {
        var dThiessenAnalystParameters = new ol.supermap.DatasetThiessenAnalystParameters({
            dataset: "Town_P@London"
        });
        new ol.supermap.SpatialAnalystService(serviceUrl).thiessenAnalysis(dThiessenAnalystParameters).then(function (serviceResult) {
            var viewProj = map.getView().getProjection();
            var features = (new ol.format.GeoJSON()).readFeatures(serviceResult.result.regions);
            features.forEach(function(feature) {
                feature.getGeometry().transform('EPSG:4326', viewProj);
            });
            var vectorSource = new ol.source.Vector({
                features: features
            });
            var resultLayer = new ol.layer.Vector({
                source: vectorSource,
                style: new ol.style.Style({
                    stroke: new ol.style.Stroke({
                        color: 'blue',
                        width: 2
                    }),
                    fill: new ol.style.Fill({
                        color: 'rgba(0, 0, 255, 0.3)'
                    })
                })
            });
            map.addLayer(resultLayer);
        });
    }
</script>
</body>
</html>
