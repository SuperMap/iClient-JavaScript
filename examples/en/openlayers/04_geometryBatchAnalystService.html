<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_geometryBatchAnalystService"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
    <script type="text/javascript" src="../../../dist/ol/include-ol.js"></script>
    <style>
        .ol-popup {
            position: absolute;
            background-color: white;
            -webkit-filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.2));
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.2));
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 120px;
        }

        .ol-popup:after, .ol-popup:before {
            top: 100%;
            border: solid transparent;
            content: " ";
            height: 0;
            width: 0;
            position: absolute;
            pointer-events: none;
        }

        .ol-popup:after {
            border-top-color: white;
            border-width: 10px;
            left: 48px;
            margin-left: -10px;
        }

        .ol-popup:before {
            border-top-color: #cccccc;
            border-width: 11px;
            left: 48px;
            margin-left: -11px;
        }
    </style>
</head>
<body style="margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<div id="popup" class="ol-popup">
    <div id="popup-content"></div>
</div>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";
    var map,
        baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst";
    var container = document.getElementById('popup'),
        content = document.getElementById('popup-content'),
        overlay = new ol.Overlay(({
            element: container,
            autoPan: true,
            autoPanAnimation: {
                duration: 250
            },
            offset: [0, -5]
        }));
    new ol.supermap.MapService(baseUrl).getMapInfo().then(function (serviceResult) {
        var mapJSONObj = serviceResult.result;
        map = new ol.Map({
            target: 'map',
            controls: ol.control.defaults.defaults({attributionOptions: {collapsed: false}})
                .extend([new ol.supermap.control.Logo({ link: "https://iclient.supermap.io" })]),
            view: new ol.View(ol.supermap.viewOptionsFromMapJSON(mapJSONObj)),
            overlays: [overlay]
        });
        options = ol.source.TileSuperMapRest.optionsFromMapJSON(baseUrl, mapJSONObj);
        var layer = new ol.layer.Tile({
            source: new ol.source.TileSuperMapRest(options)
        });
        map.addLayer(layer);

        // Zoom in and center on the geometry area
        map.getView().setCenter(ol.proj.transform([-0.08, 51.48], 'EPSG:4326', map.getView().getProjection()));
        map.getView().setZoom(0);

        batchAnalystFromGeometry();
    });

    function batchAnalystFromGeometry() {
        // Buffer analysis data:
        // Keep the same structure as the Chinese version, coordinates changed to London area
        var bufferLine = {
            "type": "Feature",
            "geometry": {
                "type": "LineString",
                "coordinates": [[-0.08, 51.60], [0.25, 51.53]]
            }
        };
        var bufferPoint = {
            "type": "Feature",
            "geometry": {
                "type": "Point",
                "coordinates": [-0.06, 51.55]
            }
        };
        // Overlay analysis data:
        var sourceGeometry = {
            "type": "Feature",
            "geometry": {
                "type": "Polygon",
                "coordinates": [[[-0.30, 51.50],
                    [-0.30, 51.40],
                    [-0.10, 51.40],
                    [-0.10, 51.50],
                    [-0.30, 51.50]]]
            }
        };
        var operateGeometry = {
            "type": "Feature",
            "geometry": {
                "type": "Polygon",
                "coordinates": [[[-0.25, 51.58],
                    [-0.25, 51.32],
                    [-0.15, 51.32],
                    [-0.15, 51.58],
                    [-0.25, 51.58]]]
            }
        };

        // Load data to map:
        var geojsonFeature = {
            "type": "FeatureCollection",
            "features": [bufferLine, bufferPoint, sourceGeometry, operateGeometry]
        };
        var styles = {
            'Point': new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 4,
                    fill: new ol.style.Fill({
                        color: 'rgba(0,0,255)'
                    }),
                    stroke: new ol.style.Stroke({color: 'blue', width: 1.5})
                })
            }),
            'Polygon': new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: 'blue',
                    width: 1
                }),
                fill: new ol.style.Fill({
                    color: 'rgba(174, 238, 238, 0.3)'
                })
            }),
            'LineString': new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: 'blue',
                    width: 1.5
                })
            })
        };

        var styleFunction = function (feature) {
            return styles[feature.getGeometry().getType()];
        };
        var overlaySource = new ol.source.Vector({
            features: (new ol.format.GeoJSON()).readFeatures(geojsonFeature)
        });
        // Transform input geometries from EPSG:4326 to view projection
        overlaySource.getFeatures().forEach(function(feature) {
            feature.getGeometry().transform('EPSG:4326', map.getView().getProjection());
        });

        var overlayLayer = new ol.layer.Vector({
            source: overlaySource,
            style: styleFunction
        });
        map.addLayer(overlayLayer);

        // Buffer analysis parameters (buffer scaled to about 1000 meters)
        var geoBufferAnalystParams = {
            analystName: "buffer",
            param: new ol.supermap.GeometryBufferAnalystParameters({
                sourceGeometry: bufferLine,
                sourceGeometrySRID: 4326,
                bufferSetting: new ol.supermap.BufferSetting({
                    endType: ol.supermap.BufferEndType.ROUND,
                    leftDistance: new ol.supermap.BufferDistance({value: 1000}),
                    rightDistance: new ol.supermap.BufferDistance({value: 1000}),
                    radiusUnit: "METER",
                    semicircleLineSegment: 10
                })

            })
        };
        var geoBufferAnalystParams_Point = {
            analystName: "buffer",
            param: new ol.supermap.GeometryBufferAnalystParameters({
                sourceGeometry: bufferPoint,
                sourceGeometrySRID: 4326,
                bufferSetting: new ol.supermap.BufferSetting({
                    endType: ol.supermap.BufferEndType.ROUND,
                    leftDistance: new ol.supermap.BufferDistance({value: 2000}),
                    rightDistance: new ol.supermap.BufferDistance({value: 2000}),
                    radiusUnit: "METER",
                    semicircleLineSegment: 10
                })

            })
        };

        // Overlay analysis parameters
        var OverlayBatchAnalystParameters = {
            analystName: "overlay",
            param: new ol.supermap.GeometryOverlayAnalystParameters({
                sourceGeometry: sourceGeometry,
                operateGeometry: operateGeometry,
                operation: ol.supermap.OverlayOperationType.CLIP
            })
        };

        // Batch analysis parameters
        var paramter = [geoBufferAnalystParams, OverlayBatchAnalystParameters, geoBufferAnalystParams_Point];

        // Batch analysis
        new ol.supermap.SpatialAnalystService(serviceUrl).geometrybatchAnalysis(paramter).then(function (serviceResult) {
            // Display results
            serviceResult.result[0].resultGeometry.properties.analystType = "buffer_line";
            serviceResult.result[1].resultGeometry.properties.analystType = "overlay";
            serviceResult.result[2].resultGeometry.properties.analystType = "buffer_point";
            var results = [];
            serviceResult.result.map(function (itme) {
                results.push(itme.resultGeometry)
            });
            var resultSource = new ol.source.Vector({
                features: (new ol.format.GeoJSON()).readFeatures({
                    "type": "FeatureCollection",
                    "features": results
                })
            });
            // Transform results from EPSG:4326 to view projection
            resultSource.getFeatures().forEach(function(feature) {
                feature.getGeometry().transform('EPSG:4326', map.getView().getProjection());
            });
            var resultLayer = new ol.layer.Vector({
                source: resultSource,
                style: new ol.style.Style({
                    stroke: new ol.style.Stroke({
                        color: 'red',
                        width: 1.5
                    }),
                    fill: new ol.style.Fill({
                        color: 'rgba(255, 0, 0, 0.3)'
                    })
                })
            });
            map.addLayer(resultLayer);
            map.on('pointermove', function (e) {
                var isShowPop = false;
                map.forEachFeatureAtPixel(e.pixel, function (feature) {
                    if (feature.getProperties().analystType === "buffer_line") {
                        map.getTargetElement().style.cursor = 'pointer';
                        var contentHTML = resources.text_bufferAnalystResult;
                        content.innerHTML = contentHTML;
                        overlay.setPosition(ol.proj.transform([0.07, 51.56], 'EPSG:4326', map.getView().getProjection()));
                        map.addOverlay(overlay);
                        isShowPop = true;
                    } else if (feature.getProperties().analystType === "buffer_point") {
                        map.getTargetElement().style.cursor = 'pointer';
                        var contentHTML = resources.text_bufferAnalystResult;
                        content.innerHTML = contentHTML;
                        overlay.setPosition(ol.proj.transform([-0.06, 51.50], 'EPSG:4326', map.getView().getProjection()));
                        map.addOverlay(overlay);
                        isShowPop = true;
                    } else if (feature.getProperties().analystType === "overlay") {
                        map.getTargetElement().style.cursor = 'pointer';
                        var contentHTML = resources.text_overlayAnalystResult;
                        content.innerHTML = contentHTML;
                        overlay.setPosition(ol.proj.transform([-0.20, 51.45], 'EPSG:4326', map.getView().getProjection()));
                        map.addOverlay(overlay);
                        isShowPop = true;
                    }
                }, {
                    hitTolerance: 10
                });
                if (isShowPop) {
                    return;
                } else {
                    map.getTargetElement().style.cursor = '';
                    overlay.setPosition(undefined);
                    map.removeOverlay(overlay);
                }
            });
        });
    }
</script>
</body>
</html>
