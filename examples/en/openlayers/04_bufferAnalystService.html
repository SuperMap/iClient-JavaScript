<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_bufferAnalystService"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
    <script type="text/javascript" src="../../../dist/ol/include-ol.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%; position: absolute;top: 0;">
<div id="map" style="width: 100%;height:100%"></div>
<script type="text/javascript">
    var map, roadLine,
        host = (window.isLocal ? window.server : "https://iserver.supermap.io"),
        baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst";

    new ol.supermap.MapService(baseUrl).getMapInfo().then(function (serviceResult) {
        var mapJSONObj = serviceResult.result;
        map = new ol.Map({
            target: 'map',
            controls: ol.control.defaults.defaults({attributionOptions: {collapsed: false}})
                .extend([new ol.supermap.control.Logo({ link: "https://iclient.supermap.io" })]),
            view: new ol.View(ol.supermap.viewOptionsFromMapJSON(mapJSONObj))
        });
        var layer = new ol.layer.Tile({
            source: new ol.source.TileSuperMapRest(ol.source.TileSuperMapRest.optionsFromMapJSON(baseUrl, mapJSONObj))
        });
        map.addLayer(layer);

        // Zoom in and center on the route location, reference leaflet: center:[51.644, -0.188], zoom:16
        map.getView().setCenter(ol.proj.transform([-0.188, 51.644], 'EPSG:4326', map.getView().getProjection()));
        map.getView().setZoom(16);

        // Convert EPSG:4326 coordinates [lon, lat] to view projection coordinates
        var viewProj = map.getView().getProjection();
        var coords = [
            [-0.1896293, 51.6456481],
            [-0.1895803, 51.6456036],
            [-0.1895245, 51.645551],
            [-0.1890055, 51.6450801],
            [-0.1887808, 51.6448764],
            [-0.1885605, 51.6446756],
            [-0.1883084, 51.6443753],
            [-0.1875496, 51.6433375],
            [-0.1871538, 51.6427874],
            [-0.1864036, 51.6415504],
            [-0.1862165, 51.6411939],
            [-0.1859495, 51.6406583],
            [-0.1858855, 51.6405461]
        ];
        var transformedCoords = coords.map(function(c) {
            return ol.proj.transform(c, 'EPSG:4326', viewProj);
        });
        roadLine = new ol.geom.LineString(transformedCoords);

        var vectorSource = new ol.source.Vector({
            features: [new ol.Feature(roadLine)]
        });
        var vectorLayer = new ol.layer.Vector({
            source: vectorSource,
            style: new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: 'blue',
                    width: 3
                }),
                fill: new ol.style.Fill({
                    color: 'rgba(0, 0, 255, 0.1)'
                })
            })
        });
        map.addLayer(vectorLayer);
        bufferAnalystProcess();
    });

    function bufferAnalystProcess() {
        var dsBufferAnalystParameters = new ol.supermap.DatasetBufferAnalystParameters({
            dataset: "MinorRoads_L@London",
            filterQueryParameter: new ol.supermap.FilterParameter({
                attributeFilter: "NAME='Sherrards Way'"
            }),
            bufferSetting: new ol.supermap.BufferSetting({
                endType: ol.supermap.BufferEndType.ROUND,
                leftDistance: {value: 10},
                rightDistance: {value: 10},
                semicircleLineSegment: 10
            })
        });
        new ol.supermap.SpatialAnalystService(serviceUrl).bufferAnalysis(dsBufferAnalystParameters).then(function (serviceResult) {
            var viewProj = map.getView().getProjection();
            var features = (new ol.format.GeoJSON()).readFeatures(serviceResult.result.recordset.features);
            // Convert buffer result to view projection
            features.forEach(function(feature) {
                feature.getGeometry().transform('EPSG:4326', viewProj);
            });
            var vectorSource = new ol.source.Vector({
                features: features
            });
            var resultLayer = new ol.layer.Vector({
                source: vectorSource,
                style: new ol.style.Style({
                    stroke: new ol.style.Stroke({
                        color: 'red',
                        width: 1
                    }),
                    fill: new ol.style.Fill({
                        color: 'rgba(255, 0, 0, 0.1)'
                    })
                })
            });
            map.addLayer(resultLayer);
        });
    }
</script>
</body>
</html>
