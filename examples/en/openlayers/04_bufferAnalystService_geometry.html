<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_bufferAnalystServiceGeometry"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
    <script type="text/javascript" src="../../../dist/ol/include-ol.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%; position: absolute;top: 0;">
<div id="map" style="width: 100%;height:100%"></div>
<script type="text/javascript">
    var map, options,
        host = (window.isLocal ? window.server : "https://iserver.supermap.io"),
        baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst";
    new ol.supermap.MapService(baseUrl).getMapInfo().then(function (serviceResult) {
        var mapJSONObj = serviceResult.result;
        map = new ol.Map({
            target: 'map',
            controls: ol.control.defaults.defaults({attributionOptions: {collapsed: false}})
                .extend([new ol.supermap.control.Logo({ link: "https://iclient.supermap.io" })]),
            view: new ol.View(ol.supermap.viewOptionsFromMapJSON(mapJSONObj))
        });
        options = ol.source.TileSuperMapRest.optionsFromMapJSON(baseUrl, mapJSONObj);
        var layer = new ol.layer.Tile({
            source: new ol.source.TileSuperMapRest(options)
        });
        map.addLayer(layer);

        // Zoom in and center on the route location, reference leaflet: center:[51.49, -0.06], zoom:12
        map.getView().setCenter(ol.proj.transform([-0.06, 51.50], 'EPSG:4326', map.getView().getProjection()));
        map.getView().setZoom(2);
        console.log('Map projection:', map.getView().getProjection().getCode());

        geoBufferAnalystProcess();
    });

    function geoBufferAnalystProcess() {
        // Leaflet uses [lat, lon], OpenLayers uses [lon, lat]
        var pointsList = [
            [-0.22, 51.49],
            [-0.18, 51.49],
            [-0.14, 51.50],
            [-0.10, 51.50],
            [-0.06, 51.50],
            [-0.02, 51.49],
            [0.02, 51.50],
            [0.06, 51.50],
            [0.10, 51.50]
        ];
        // Transform coordinates to the view's projection for display
        var viewProj = map.getView().getProjection();
        var transformedPoints = pointsList.map(function(c) {
            return ol.proj.transform(c, 'EPSG:4326', viewProj);
        });
        // Add all discrete GPS signal points to the map
        for (i = 0; i < transformedPoints.length; i++) {
            var point = new ol.Feature({
                geometry: new ol.geom.Point(transformedPoints[i])
            });
            var pointLayer = new ol.layer.Vector({
                source: new ol.source.Vector({
                    features: [point]
                }),
                style: new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 4,
                        fill: new ol.style.Fill({
                            color: 'black'
                        })
                    })
                })
            });
            map.addLayer(pointLayer);
        }
        // Add the route line generated from discrete GPS signal points to the map (for display)
        var roadLine = new ol.geom.LineString(transformedPoints);
        var roadLineSource = new ol.source.Vector({
            features: [new ol.Feature(roadLine)]
        });
        var roadLineLayer = new ol.layer.Vector({
            source: roadLineSource,
            style: new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: 'red',
                    width: 3
                })
            })
        });
        map.addLayer(roadLineLayer);
        // Create buffer analysis service parameters (using EPSG:4326 coordinates)
        var roadLineForService = new ol.geom.LineString(pointsList);
        roadLineForService.SRID = 4326;
        geoBufferAnalystParams = new ol.supermap.GeometryBufferAnalystParameters({
            sourceGeometry: roadLineForService,
            sourceGeometrySRID: 4326,
            bufferSetting: new ol.supermap.BufferSetting({
                endType: ol.supermap.BufferEndType.ROUND,
                leftDistance: new ol.supermap.BufferDistance({value: 500}),
                rightDistance: new ol.supermap.BufferDistance({value: 500}),
                semicircleLineSegment: 10
            })
        });
        // Send request to iServer and return results
        new ol.supermap.SpatialAnalystService(serviceUrl).bufferAnalysis(geoBufferAnalystParams).then(function (serviceResult) {
            var coords = serviceResult.result.resultGeometry.geometry.coordinates[0][0];
            var polygon = new ol.geom.Polygon([coords]);
            polygon.transform('EPSG:4326', 'EPSG:3857');
            var bufferSource = new ol.source.Vector({
                features: [new ol.Feature(polygon)]
            });
            var resultLayer = new ol.layer.Vector({
                source: bufferSource,
                style: new ol.style.Style({
                    stroke: new ol.style.Stroke({
                        color: 'blue',
                        width: 1
                    }),
                    fill: new ol.style.Fill({
                        color: 'rgba(255, 0, 0, 0.1)'
                    })
                })
            });
            map.addLayer(resultLayer);

            // Method 1: Display mock points within the buffer area
            var mockPoints = [
                [-0.19, 51.490], [-0.18, 51.494], [-0.17, 51.498], [-0.16, 51.492],
                [-0.15, 51.496], [-0.14, 51.500], [-0.13, 51.493], [-0.12, 51.497],
                [-0.11, 51.491], [-0.10, 51.495], [-0.09, 51.499], [-0.08, 51.502],
                [-0.07, 51.496], [-0.06, 51.500], [-0.05, 51.494], [-0.04, 51.498],
                [-0.03, 51.493], [-0.02, 51.497], [-0.01, 51.501], [0.00, 51.495],
                [0.01, 51.499], [0.02, 51.493], [0.03, 51.497], [0.04, 51.500],
                [0.05, 51.494], [0.06, 51.498], [0.07, 51.502], [0.08, 51.496],
                [0.09, 51.500], [0.10, 51.494]
            ];
            var mockFeatures = mockPoints.map(function(coord) {
                var transformed = ol.proj.transform(coord, 'EPSG:4326', viewProj);
                return new ol.Feature({
                    geometry: new ol.geom.Point(transformed)
                });
            });
            var iconStyle = new ol.style.Style({
                image: new ol.style.Icon(({
                    anchor: [0.5, 1],
                    src: '../img/marker-gold.png'
                }))
            });
            mockFeatures.forEach(function(feature) {
                feature.setStyle(iconStyle);
            });
            var mockSource = new ol.source.Vector({ features: mockFeatures });
            var resultLayer1 = new ol.layer.Vector({
                source: mockSource
            });
            map.addLayer(resultLayer1);

            // Method 2: Query points from iServer using buffer geometry
            // Extract the boundary points of the buffer to construct the geometry for the query service
            // var bufferPoints = [];
            // var coordinate = serviceResult.result.resultGeometry.geometry.coordinates[0][0];
            // for (var i = 0; i < coordinate.length; i++) {
            //     bufferPoints.push([coordinate[i][0], coordinate[i][1]]);
            // }
            // var geometry = new ol.geom.Polygon([bufferPoints]);
            // queryByGeometryParameters = new ol.supermap.QueryByGeometryParameters({
            //     queryParams: [new ol.supermap.FilterParameter({name: "City_P@London.1"})],
            //     geometry: geometry,
            //     spatialQueryMode: ol.supermap.SpatialQueryMode.INTERSECT
            // });

            // new ol.supermap.QueryService(baseUrl).queryByGeometry(queryByGeometryParameters).then(function (serviceResult) {
            //     var features = (new ol.format.GeoJSON()).readFeatures(serviceResult.result.recordsets[0].features);
            //     var iconStyle = new ol.style.Style({
            //         image: new ol.style.Icon(({
            //             anchor: [0.5, 1],
            //             src: '../img/marker-gold.png'
            //         }))
            //     });
            //     for (var i = 0; i < features.length; i++) {
            //         features[i].setStyle(iconStyle);
            //     }
            //     var vectorSource = new ol.source.Vector({
            //         features: features
            //     });
            //     var resultLayer1 = new ol.layer.Vector({
            //         source: vectorSource
            //     });
            //     map.addLayer(resultLayer1);
            // });
        });
    }
</script>
</body>
</html>
