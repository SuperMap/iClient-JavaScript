<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_themeUnique"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<script type="text/javascript" src="../../../dist/leaflet/include-leaflet.js"></script>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";
    var map, themeService, themeUnique, themeParameters, themeLayer,
        url = host + "/iserver/services/map-World_en/rest/maps/World%20Map_VEC";
    map = L.map('map', {
        crs: L.CRS.EPSG4326,
        center: [0, 0],
        maxZoom: 18,
        zoom: 2
    });
    new L.supermap.TiledMapLayer(url, {noWrap: true, transparent: true}).addTo(map);
    createTheme();

    function createTheme() {
        themeService = new L.supermap.ThemeService(url);
        var style1, style2, style3, style4, style5, style6, style7, style8;
        style1 = new L.supermap.ServerStyle({
            fillForeColor: new L.supermap.ServerColor(248, 203, 249),
            lineColor: new L.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style2 = new L.supermap.ServerStyle({
            fillForeColor: new L.supermap.ServerColor(196, 255, 189),
            lineColor: new L.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style3 = new L.supermap.ServerStyle({
            fillForeColor: new L.supermap.ServerColor(255, 0, 0),
            lineColor: new L.supermap.ServerColor(200, 0, 0),
            lineWidth: 0.5
        });
        style4 = new L.supermap.ServerStyle({
            fillForeColor: new L.supermap.ServerColor(255, 239, 168),
            lineColor: new L.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style5 = new L.supermap.ServerStyle({
            fillForeColor: new L.supermap.ServerColor(173, 209, 255),
            lineColor: new L.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style6 = new L.supermap.ServerStyle({
            fillForeColor: new L.supermap.ServerColor(132, 164, 232),
            lineColor: new L.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style7 = new L.supermap.ServerStyle({
            fillForeColor: new L.supermap.ServerColor(0, 255, 0),
            lineColor: new L.supermap.ServerColor(0, 200, 0),
            lineWidth: 0.5
        });
        style8 = new L.supermap.ServerStyle({
            fillForeColor: new L.supermap.ServerColor(0, 206, 209),
            lineColor: new L.supermap.ServerColor(0, 160, 160),
            lineWidth: 0.5
        });

        var themeUniqueIteme1 = new L.supermap.ThemeUniqueItem({
                unique: "China",
                style: style3
            }),
            themeUniqueIteme2 = new L.supermap.ThemeUniqueItem({
                unique: "Russia",
                style: style2
            }),
            themeUniqueIteme3 = new L.supermap.ThemeUniqueItem({
                unique: "United States of America",
                style: style4
            }),
            themeUniqueIteme4 = new L.supermap.ThemeUniqueItem({
                unique: "Japan",
                style: style5
            }),
            themeUniqueIteme5 = new L.supermap.ThemeUniqueItem({
                unique: "India",
                style: style6
            }),
            themeUniqueIteme6 = new L.supermap.ThemeUniqueItem({
                unique: "Brazil",
                style: style7
            }),
            themeUniqueIteme7 = new L.supermap.ThemeUniqueItem({
                unique: "Canada",
                style: style8
            }),
            themeUniqueIteme8 = new L.supermap.ThemeUniqueItem({
                unique: "Australia",
                style: style1
            }),
            themeUniqueIteme9 = new L.supermap.ThemeUniqueItem({
                unique: "France",
                style: style2
            }),
            themeUniqueIteme10 = new L.supermap.ThemeUniqueItem({
                unique: "Germany",
                style: style4
            }),
            themeUniqueIteme11 = new L.supermap.ThemeUniqueItem({
                unique: "United Kingdom",
                style: style5
            }),
            themeUniqueIteme12 = new L.supermap.ThemeUniqueItem({
                unique: "Greenland",
                style: style6
            }),
            themeUniqueIteme13 = new L.supermap.ThemeUniqueItem({
                unique: "Mexico",
                style: style7
            }),
            themeUniqueIteme14 = new L.supermap.ThemeUniqueItem({
                unique: "Spain",
                style: style8
            }),
            themeUniqueIteme15 = new L.supermap.ThemeUniqueItem({
                unique: "Italy",
                style: style1
            }),
            themeUniqueIteme16 = new L.supermap.ThemeUniqueItem({
                unique: "Poland",
                style: style2
            }),
            themeUniqueIteme17 = new L.supermap.ThemeUniqueItem({
                unique: "Turkey",
                style: style4
            }),
            themeUniqueIteme18 = new L.supermap.ThemeUniqueItem({
                unique: "Saudi Arabia",
                style: style5
            }),
            themeUniqueIteme19 = new L.supermap.ThemeUniqueItem({
                unique: "South Africa",
                style: style6
            }),
            themeUniqueIteme20 = new L.supermap.ThemeUniqueItem({
                unique: "Egypt",
                style: style7
            }),
            themeUniqueIteme21 = new L.supermap.ThemeUniqueItem({
                unique: "Indonesia",
                style: style8
            }),
            themeUniqueIteme22 = new L.supermap.ThemeUniqueItem({
                unique: "Thailand",
                style: style1
            }),
            themeUniqueIteme23 = new L.supermap.ThemeUniqueItem({
                unique: "Kazakhstan",
                style: style2
            }),
            themeUniqueIteme24 = new L.supermap.ThemeUniqueItem({
                unique: "Mongolia",
                style: style4
            });

        var themeUniqueItemes = [
            themeUniqueIteme1, themeUniqueIteme2, themeUniqueIteme3,
            themeUniqueIteme4, themeUniqueIteme5, themeUniqueIteme6,
            themeUniqueIteme7, themeUniqueIteme8, themeUniqueIteme9,
            themeUniqueIteme10, themeUniqueIteme11, themeUniqueIteme12,
            themeUniqueIteme13, themeUniqueIteme14, themeUniqueIteme15,
            themeUniqueIteme16, themeUniqueIteme17, themeUniqueIteme18,
            themeUniqueIteme19, themeUniqueIteme20, themeUniqueIteme21,
            themeUniqueIteme22, themeUniqueIteme23, themeUniqueIteme24
        ];

        themeUnique = new L.supermap.ThemeUnique({
            uniqueExpression: "Country_EN",
            items: themeUniqueItemes,
            defaultStyle: style1
        });
        themeParameters = new L.supermap.ThemeParameters({
            datasetNames: ["Country_R"],
            dataSourceNames: ["World"],
            themes: [themeUnique]
        });
        themeService.getThemeInfo(themeParameters).then(function(serviceResult) {
            var result = serviceResult.result;
            if (result && result.newResourceID) {
                themeLayer = new L.supermap.TiledMapLayer(url, {
                    noWrap: true,
                    cacheEnabled: false,
                    transparent: true,
                    layersID: result.newResourceID
                }).addTo(map);
            }
        });
    }
</script>
</body>
</html>
