<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="resources.text_mapOverlay"></title>
    <script type="text/javascript" src="../../js/include-web.js" ></script>
  </head>
  <body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript" src="../../../dist/leaflet/include-leaflet.js" ></script>
    <script type="text/javascript">
      var host = window.isLocal ? window.server : "https://iserver.supermap.io";
      var map,
        urlWorld = host + "/iserver/services/map-World_en/rest/maps/World%20Map_VEC",
        urlLondon = host + "/iserver/services/map-London/rest/maps/London%20Map";

      // Method 1: L.supermap.initMap
      L.supermap.initMap(urlWorld, { mapOptions: { center: [51, 0], zoom: 18 } }).then(({ map, layer }) => {
        var overlayLayer = new L.supermap.TiledMapLayer(urlLondon, {
          transparent: true,
          opacity: 0.6
        }).addTo(map);
        L.control.layers({"baseLayer": layer}, {"overlayLayer": overlayLayer}).setPosition('topleft').addTo(map);
      });
      /*
          // Method 2: 1. Call L.supermap.MapService to get the map info from SuperMap iServer map service
          //         2. Call L.supermap.crsFromMapJSON to create CRS
          //         3. Call L.map to create the map
          //         4. Call L.supermap.TiledMapLayer to create the base layer and overlay layer
        new L.supermap.MapService(urlWorld).getMapInfo().then((res) => {
            var crs = L.supermap.crsFromMapJSON(res.result);
            map = L.map('map', {
              crs: crs,
              center: [40, 118],
              maxZoom: 18,
              zoom: 7
            });
            var layer = new L.supermap.TiledMapLayer(urlWorld).addTo(map);
            var overlayLayer = new L.supermap.TiledMapLayer(urlLondon, {
              transparent: true,
              opacity: 0.6
            }).addTo(map);
            L.control.layers({"baseLayer": layer}, {"overlayLayer": overlayLayer}).setPosition('topleft').addTo(map);
        });
      */
    </script>
  </body>
</html>
