<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_thiessenAnalystGeometry"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<script type="text/javascript" src="../../../dist/leaflet/include-leaflet.js"></script>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";
    var map, thiessenAnalystService, gThiessenAnalystParameters,
        baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst";
    map = L.map('map', {
        center: [51.50, -0.06],
        maxZoom: 18,
        zoom: 10
    });
    new L.supermap.TiledMapLayer(baseUrl, {noWrap: true}).addTo(map);
    thiessenAnalystProcess();

    function thiessenAnalystProcess() {
        var pointsList = [
            [51.50, -0.06],
            [51.53, -0.03],
            [51.48, -0.10],
            [51.55, -0.08],
            [51.45, -0.12],
            [51.52, -0.02],
            [51.47, -0.15],
            [51.58, -0.05],
            [51.43, -0.08],
            [51.56, -0.14]
        ];
        gThiessenAnalystParameters = new L.supermap.GeometryThiessenAnalystParameters({
            points: pointsList
        });
        thiessenAnalystService = new L.supermap.SpatialAnalystService(serviceUrl);
        thiessenAnalystService.thiessenAnalysis(gThiessenAnalystParameters).then(function (serviceResult) {
            L.geoJSON(serviceResult.result.regions, {
                weight: 2,
                color: 'blue',
                fillColor: 'lightblue',
                fillOpacity: 0.5,
                coordsToLatLng: function(coords) {
                    return L.latLng(coords[0], coords[1]);
                }
            }).addTo(map);
        });
    }
</script>
</body>
</html>
