<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_overlayAnalyst"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<script type="text/javascript" src="../../../dist/leaflet/include-leaflet.js"></script>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";
    var map, overlayAnalystService, datasetOverlayAnalystParameters, resultLayer,
        baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst";
    map = L.map('map', {
        center: [51.50, -0.06],
        maxZoom: 18,
        zoom: 10
    });
    new L.supermap.TiledMapLayer(baseUrl, {transparent: true, noWrap: true}).addTo(map);
    overlayAnalystProcess();

    function overlayAnalystProcess() {
        overlayAnalystService = new L.supermap.SpatialAnalystService(serviceUrl);
        datasetOverlayAnalystParameters = new L.supermap.DatasetOverlayAnalystParameters({
            sourceDataset: "Commercial_R@London",
            operateDataset: "Park_R@London",
            tolerance: 0,
            operation: L.supermap.OverlayOperationType.UNION
        });
        overlayAnalystService.overlayAnalysis(datasetOverlayAnalystParameters).then(function (serviceResult) {
            var result = serviceResult.result;
            if (result && result.recordset && result.recordset.features) {
                resultLayer = L.geoJSON(result.recordset.features).addTo(map);
            }
        });
    }
</script>
</body>
</html>
