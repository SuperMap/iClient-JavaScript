<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_geometryBatchAnalystService"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
</head>
<body style="margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<script type="text/javascript" src="../../../dist/leaflet/include-leaflet.js"></script>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";
    var baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst",
        map = L.map('map', {
            center: [51.50, -0.06],
            maxZoom: 18,
            zoom: 10
        });
    new L.supermap.TiledMapLayer(baseUrl, {noWrap: true}).addTo(map);

    batchAnalystFromGeometry();

    function batchAnalystFromGeometry() {
        // Buffer analysis data:
        // Keep the same structure as the Chinese version, coordinates changed to London area, scaled to about 0.25x
        var bufferLine = {
            "type": "Feature",
            "geometry": {
                "type": "LineString",
                "coordinates": [[-0.08, 51.60], [0.25, 51.53]]
            }
        };
        var bufferPoint = {
            "type": "Feature",
            "geometry": {
                "type": "Point",
                "coordinates": [-0.06, 51.55]
            }
        };
        // Overlay analysis data:
        var sourceGeometry = {
            "type": "Feature",
            "geometry": {
                "type": "Polygon",
                "coordinates": [[[-0.30, 51.50],
                    [-0.30, 51.40],
                    [-0.10, 51.40],
                    [-0.10, 51.50],
                    [-0.30, 51.50]]]
            }
        };
        var operateGeometry = {
            "type": "Feature",
            "geometry": {
                "type": "Polygon",
                "coordinates": [[[-0.25, 51.58],
                    [-0.25, 51.32],
                    [-0.15, 51.32],
                    [-0.15, 51.58],
                    [-0.25, 51.58]]]
            }
        };

        // Load data to map:
        var geojsonFeature = {
            "type": "FeatureCollection",
            "features": [bufferLine, bufferPoint, sourceGeometry, operateGeometry]
        };

        L.geoJSON(geojsonFeature, {
            style: function (feature) {
                if (feature.geometry.type === "LineString") {
                    return {
                        "color": "blue",
                        "weight": 1.5,
                    };
                } else if (feature.geometry.type === "Polygon") {
                    return {
                        "weight": 1.5,
                        "color": "blue",
                        "opacity": 0.15
                    };
                }
            }
        }).addTo(map);

        // Buffer analysis parameters (buffer scaled to about 1000 meters)
        var geoBufferAnalystParams = {
            analystName: "buffer",
            param: new L.supermap.GeometryBufferAnalystParameters({
                sourceGeometry: bufferLine,
                sourceGeometrySRID: 4326,
                bufferSetting: new L.supermap.BufferSetting({
                    endType: L.supermap.BufferEndType.ROUND,
                    leftDistance: new L.supermap.BufferDistance({value: 1000}),
                    rightDistance: new L.supermap.BufferDistance({value: 1000}),
                    radiusUnit: "METER",
                    semicircleLineSegment: 10
                })

            })
        };
        var geoBufferAnalystParams_Point = {
            analystName: "buffer",
            param: new L.supermap.GeometryBufferAnalystParameters({
                sourceGeometry: bufferPoint,
                sourceGeometrySRID: 4326,
                bufferSetting: new L.supermap.BufferSetting({
                    endType: L.supermap.BufferEndType.ROUND,
                    leftDistance: new L.supermap.BufferDistance({value: 2000}),
                    rightDistance: new L.supermap.BufferDistance({value: 2000}),
                    radiusUnit: "METER",
                    semicircleLineSegment: 10
                })

            })
        };

        // Overlay analysis parameters
        var OverlayBatchAnalystParameters = {
            analystName: "overlay",
            param: new L.supermap.GeometryOverlayAnalystParameters({
                sourceGeometry: sourceGeometry,
                operateGeometry: operateGeometry,
                operation: L.supermap.OverlayOperationType.CLIP
            })
        };

        // Batch analysis parameters
        var paramter = [geoBufferAnalystParams, OverlayBatchAnalystParameters, geoBufferAnalystParams_Point];

        // Batch analysis
        new L.supermap.SpatialAnalystService(serviceUrl).geometrybatchAnalysis(paramter).then(function (serviceResult) {
            // Display results
            var overlayResultStyle = {
                "color": "red",
                "opacity": 0.65
            };

            var bufferResultLayer = L.geoJSON([serviceResult.result[0].resultGeometry, serviceResult.result[2].resultGeometry], {
                style: overlayResultStyle
            }).addTo(map);
            bufferResultLayer.on("mousemove", function (e) {
                e.layer.bindPopup('<h4>'+resources.text_bufferAnalystResult+'</h4>').openPopup();
            });
            bufferResultLayer.on("mouseout", function (e) {
                e.layer.closePopup();
            });

            var overlayResultLayer = L.geoJSON(serviceResult.result[1].resultGeometry, {
                style: overlayResultStyle
            }).addTo(map);
            overlayResultLayer.on("mousemove", function (e) {
                e.layer.bindPopup('<h4>'+resources.text_overlayAnalystResult+'</h4>').openPopup();
            });
            overlayResultLayer.on("mouseout", function (e) {
                e.layer.closePopup();
            });
        });
    }
</script>
</body>
</html>
