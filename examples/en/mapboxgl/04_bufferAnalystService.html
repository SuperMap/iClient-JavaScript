<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_bufferAnalystService"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<script type="text/javascript" src="../../../dist/mapboxgl/include-mapboxgl.js"></script>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";
    var map,
        attribution = "<a href='https://www.mapbox.com/about/maps/' target='_blank'>© Mapbox </a>" +
            " with <span>© <a href='https://iclient.supermap.io' target='_blank'>SuperMap iClient</a> | </span>" +
            " Map Data <span>© <a href='http://support.supermap.com.cn/product/iServer.aspx' target='_blank'>SuperMap iServer</a></span> ",
        baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst";
    map = new mapboxgl.Map({
        container: 'map',
        style: {
            "version": 8,
            "sources": {
                "raster-tiles": {
                    "attribution": attribution,
                    "type": "raster",
                    "tiles": [host + '/iserver/services/map-London/rest/maps/London%20Map/zxyTileImage.png?prjCoordSys='+encodeURIComponent('{"epsgCode":3857}')+'&z={z}&x={x}&y={y}'],
                    "tileSize": 256
                }
            },
            "layers": [{
                "id": "simple-tiles",
                "type": "raster",
                "source": "raster-tiles",
                "minzoom": 0,
                "maxzoom": 22
            }]
        },
        center: [-0.188, 51.644],
        zoom: 14
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-left');
    map.addControl(new mapboxgl.supermap.LogoControl({ link: "https://iclient.supermap.io" }), 'bottom-right');

    map.on("load", function () {
        bufferAnalystProcess();
    });

    function bufferAnalystProcess() {
        map.addLayer({
            "id": "route",
            "type": "line",
            "source": {
                "type": "geojson",
                "data": {
                    "type": "Feature",
                    "geometry": {
                        "type": "LineString",
                        "coordinates": [
                            [-0.1896293, 51.6456481],
                            [-0.1895803, 51.6456036],
                            [-0.1895245, 51.645551],
                            [-0.1890055, 51.6450801],
                            [-0.1887808, 51.6448764],
                            [-0.1885605, 51.6446756],
                            [-0.1883084, 51.6443753],
                            [-0.1875496, 51.6433375],
                            [-0.1871538, 51.6427874],
                            [-0.1864036, 51.6415504],
                            [-0.1862165, 51.6411939],
                            [-0.1859495, 51.6406583],
                            [-0.1858855, 51.6405461]
                        ]
                    }
                }
            },
            "layout": {
                "line-join": "round",
                "line-cap": "round"
            },
            "paint": {
                "line-color": "#888",
                "line-width": 8
            }
        });
        // Buffer analysis parameters
        var dsBufferAnalystParameters = new mapboxgl.supermap.DatasetBufferAnalystParameters({
            dataset: "MinorRoads_L@London",
            filterQueryParameter: new mapboxgl.supermap.FilterParameter({
                attributeFilter: "NAME='Sherrards Way'"
            }),
            bufferSetting: new mapboxgl.supermap.BufferSetting({
                endType: mapboxgl.supermap.BufferEndType.ROUND,
                leftDistance: {value: 10},
                rightDistance: {value: 10},
                semicircleLineSegment: 10
            })
        });
        // Buffer analysis service
        new mapboxgl.supermap.SpatialAnalystService(serviceUrl).bufferAnalysis(dsBufferAnalystParameters).then(function (serviceResult) {
            map.addLayer({
                "id": "queryDatas",
                "type": "fill",
                "source": {
                    "type": "geojson",
                    "data": serviceResult.result.recordset.features
                },
                "paint": {
                    "fill-color": "red",
                    "fill-opacity": 0.4
                },
            });
        })
    }
</script>
</body>
</html>
