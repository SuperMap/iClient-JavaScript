<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_bufferAnalystServiceGeometry"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
</head>
<body style="margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<script type="text/javascript" src="../../../dist/mapboxgl/include-mapboxgl.js"></script>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";
    var map,
        attribution = "<a href='https://www.mapbox.com/about/maps/' target='_blank'>© Mapbox </a>" +
            " with <span>© <a href='https://iclient.supermap.io' target='_blank'>SuperMap iClient</a> | </span>" +
            " Map Data <span>© <a href='http://support.supermap.com.cn/product/iServer.aspx' target='_blank'>SuperMap iServer</a></span> ",
        baseUrl = host + "/iserver/services/map-London/rest/maps/London%20Map",
        serviceUrl = host + "/iserver/services/spatialAnalysis-London/restjsr/spatialanalyst";
    map = new mapboxgl.Map({
        container: 'map',
        style: {
            "version": 8,
            "sources": {
                "raster-tiles": {
                    "attribution": attribution,
                    "type": "raster",
                    "tiles": [host + '/iserver/services/map-London/rest/maps/London%20Map/zxyTileImage.png?prjCoordSys='+encodeURIComponent('{"epsgCode":3857}')+'&z={z}&x={x}&y={y}'],
                    "tileSize": 256
                }
            },
            "layers": [{
                "id": "simple-tiles",
                "type": "raster",
                "source": "raster-tiles",
            }]
        },
        center: [-0.06, 51.50],
        zoom: 11
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-left');
    map.addControl(new mapboxgl.supermap.LogoControl({ link: "https://iclient.supermap.io" }), 'bottom-right');

    map.on("load", function () {
        bufferAnalystFromGeometry();
    });

    function bufferAnalystFromGeometry() {
        var pointList = [
            [-0.22, 51.49],
            [-0.18, 51.49],
            [-0.14, 51.50],
            [-0.10, 51.50],
            [-0.06, 51.50],
            [-0.02, 51.49],
            [0.02, 51.50],
            [0.06, 51.50],
            [0.10, 51.50]
        ];

        // Load line
        var geometryLine = {
            "type": "Feature",
            "geometry": {
                "type": "LineString",
                "coordinates": pointList
            }
        };
        map.addLayer({
            "id": "bufferLine",
            "type": "line",
            "source": {
                "type": "geojson",
                "data": geometryLine
            },
            "layout": {
                "line-join": "round",
                "line-cap": "round"
            },
            "paint": {
                "line-color": "red",
                "line-width": 4
            },
        });

        // Load points
        var pointGeometryFetures = [];
        for (i = 0; i < pointList.length; i++) {
            pointGeometryFetures.push({
                "type": "Feature",
                "geometry": {
                    "type": "Point",
                    "coordinates": pointList[i],
                }
            });
        }
        map.addLayer({
            "id": "bufferPoint",
            "type": "circle",
            "source": {
                "type": "geojson",
                "data": {
                    "type": "FeatureCollection",
                    "features": pointGeometryFetures
                }
            },
            "paint": {
                "circle-radius": 6,
                "circle-color": "black",
            },
            "filter": ["==", "$type", "Point"],
        });

        var geoBufferAnalystParams = new mapboxgl.supermap.GeometryBufferAnalystParameters({
            sourceGeometry: geometryLine,
            sourceGeometrySRID: 4326,
            bufferSetting: new mapboxgl.supermap.BufferSetting({
                endType: mapboxgl.supermap.BufferEndType.ROUND,
                leftDistance: {value: 500},
                rightDistance: {value: 500},
                semicircleLineSegment: 10
            })
        });

        new mapboxgl.supermap.SpatialAnalystService(serviceUrl).bufferAnalysis(geoBufferAnalystParams).then(function (serviceResult) {
            map.addSource("queryDatas", {
                "type": "geojson",
                "data": {
                    "type": "FeatureCollection",
                    "features": [serviceResult.result.resultGeometry]
                }
            });
            map.addLayer({
                "id": "queryDatas",
                "type": "fill",
                "source": "queryDatas",
                "paint": {
                    "fill-color": "red",
                    "fill-opacity": 0.4
                },
            });

            // Method 1: Display mock points within the buffer area
            var mockPoints = {
                "type": "FeatureCollection",
                "features": [
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.19, 51.490]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.18, 51.494]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.17, 51.498]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.16, 51.492]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.15, 51.496]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.14, 51.500]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.13, 51.493]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.12, 51.497]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.11, 51.491]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.10, 51.495]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.09, 51.499]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.08, 51.502]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.07, 51.496]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.06, 51.500]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.05, 51.494]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.04, 51.498]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.03, 51.493]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.02, 51.497]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [-0.01, 51.501]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.00, 51.495]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.01, 51.499]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.02, 51.493]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.03, 51.497]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.04, 51.500]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.05, 51.494]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.06, 51.498]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.07, 51.502]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.08, 51.496]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.09, 51.500]}},
                    {type: "Feature", geometry: {type: "Point", coordinates: [0.10, 51.494]}}
                ]
            };
            map.addSource("mockPoints", {
                "type": "geojson",
                "data": mockPoints
            });
            map.addLayer({
                "id": "mockPoints",
                "type": "circle",
                "source": "mockPoints",
                "paint": {
                    "circle-radius": 6,
                    "circle-color": "#3169e6"
                }
            });

            // Method 2: Query points from iServer using buffer geometry
            // var queryService = new mapboxgl.supermap.QueryService(baseUrl);
            // var bufferGeometry = serviceResult.result.resultGeometry;
            // var queryByGeometryParameters = new mapboxgl.supermap.QueryByGeometryParameters({
            //     queryParams: [new mapboxgl.supermap.FilterParameter({name: "City_P@London.1"})],
            //     geometry: bufferGeometry,
            //     spatialQueryMode: mapboxgl.supermap.SpatialQueryMode.INTERSECT
            // });
            // queryService.queryByGeometry(queryByGeometryParameters).then(function (serviceResult) {
            //     if (serviceResult.result.recordsets && serviceResult.result.recordsets[0]) {
            //         map.addSource("queryPoints", {
            //             "type": "geojson",
            //             "data": serviceResult.result.recordsets[0].features
            //         });
            //         map.addLayer({
            //             "id": "queryPoints",
            //             "type": "circle",
            //             "source": "queryPoints",
            //             "paint": {
            //                 "circle-radius": 6,
            //                 "circle-color": "#3169e6"
            //             }
            //         });
            //     }
            // });
        });
    }
</script>
</body>
</html>
