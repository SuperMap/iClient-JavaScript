    <style>
      body {

        position: absolute;

        width: 100%;

    <div id="map"></div>
    <script type="text/javascript" src="../../../dist/mapboxgl/include-mapboxgl.js"></script>

        " Map Data <span>© <a href='http://support.supermap.com.cn/product/iServer.aspx' target='_blank'>SuperMap iServer</a></span> ";


      // Method 1: Call mapboxgl.supermap.initMap to create map and base layer from SuperMap iServer map service info
      mapboxgl.supermap
        .initMap(host + '/iserver/services/map-World_en/rest/maps/World Map_VEC', {mapOptions:{zoom: 2}})
        .then(function (result) {
          var map = result.map;
          map.addControl(new mapboxgl.NavigationControl(), 'top-left');
        });
