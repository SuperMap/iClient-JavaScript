<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_fieldStatistics"></title>
    <style>
        #popup {
            position: absolute;
            background-color: white;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.2));
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #cccccc;
            bottom: 10px;
            left: 10px;
            min-width: 280px;
            z-index: 1;
        }
    </style>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%">
    <div id="popup">
        <div id="popup-content">
            <div style="line-height: 35px;">
                <div id="tableName"><strong data-i18n="resources.text_layer"></strong>（Continent_L@World）&nbsp;&nbsp;&nbsp;<strong
                        data-i18n="resources.text_field"></strong></div>
                <div>
                    <div style="line-height: 35px;"><strong data-i18n="resources.text_statisticResult"></strong>
                        <div>
                            <table id="trafficRes" class="table table-bordered">
                                <tbody>
                                <tr>
                                    <td data-i18n="resources.text_averageValue"></td>
                                    <td data-i18n="resources.text_maxValue"></td>
                                    <td data-i18n="resources.text_minValue"></td>
                                    <td data-i18n="resources.text_standardDeviation"></td>
                                    <td data-i18n="resources.text_sum"></td>
                                    <td data-i18n="resources.text_variance"></td>
                                </tr>
                                <tr>
                                    <td id="AVERAGE"></td>
                                    <td id="MAX"></td>
                                    <td id="MIN"></td>
                                    <td id="STDDEVIATION"></td>
                                    <td id="SUM"></td>
                                    <td id="VARIANCE"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" include="bootstrap-css" src="../../js/include-web.js"></script>
<script type="text/javascript" src="../../../dist/mapboxgl/include-mapboxgl.js"></script>
<script>
    var map, currentData, layersName = [],
        baseUrl = (window.isLocal ? window.server : "https://iserver.supermap.io") + "/iserver/services/map-World_en/rest/maps/World%20Map_VEC",
        mapUrl = baseUrl + "/zxyTileImage.png?prjCoordSys="+encodeURIComponent('{"epsgCode":3857}')+"&z={z}&x={x}&y={y}",
        dataUrl = (window.isLocal ? window.server : "https://iserver.supermap.io") + "/iserver/services/data-World_en/rest/data";
    var attribution = "<a href='https://www.mapbox.com/about/maps/' target='_blank'>© Mapbox </a>" +
        " with <span>© <a href='https://iclient.supermap.io' target='_blank'>SuperMap iClient</a> | </span>" +
       " Map Data <span>© <a href='http://support.supermap.com.cn/product/iServer.aspx' target='_blank'>SuperMap iServer</a></span> ";

    map = new mapboxgl.Map({
        container: 'map',
        style: {
            "version": 8,
            "sources": {
                "raster-tiles": {
                    "attribution": attribution,
                    "type": "raster",
                    "tiles": [mapUrl],
                    "tileSize": 256
                }
            },
            "layers": [{
                "id": "simple-tiles",
                "type": "raster",
                "source": "raster-tiles",
            }]
        },
        center: [0, 0],
        zoom: 2
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-left');
    map.addControl(new mapboxgl.supermap.LogoControl({ link: "https://iclient.supermap.io" }), 'bottom-right');

    showLayersInfo();

    //获取子图层信息
    function showLayersInfo() {
        var subLayer;
        new mapboxgl.supermap.LayerInfoService(baseUrl).getLayersInfo(function (serviceResult) {
            var result = serviceResult.result;
            var layers = result.subLayers.layers;
            if (!layers) return;
            // 递归扁平化所有图层
            function flatten(layers) {
                var flat = [];
                for (var i = 0; i < layers.length; i++) {
                    var layer = layers[i];
                    if (layer.subLayers && layer.subLayers.layers) {
                        flat = flat.concat(flatten(layer.subLayers.layers));
                    } else {
                        flat.push(layer);
                    }
                }
                return flat;
            }
            var allLayers = flatten(layers);
            for (var i = 0; i < allLayers.length; i++) {
                subLayer = allLayers[i];
                if ("UGC" == subLayer.type || subLayer.datasetInfo) {
                    //记录数据源，数据集信息供字段查询统计使用
                    if (subLayer.datasetInfo && subLayer.datasetInfo.name && subLayer.datasetInfo.dataSourceName) {
                        layersName.push({
                            dataSetName: subLayer.datasetInfo.name,
                            dataSourceName: subLayer.datasetInfo.dataSourceName,
                            layerName: subLayer.name
                        });
                    }
                }
            }
            getFields();
        });
    }

    //获取字段
    function getFields() {
        // 使用第一个可用的图层
        if (layersName.length > 0) {
            currentData = layersName[0];
            var param = new mapboxgl.supermap.FieldParameters({
                datasource: currentData.dataSourceName,
                dataset: currentData.dataSetName
            });
            new mapboxgl.supermap.FieldService(dataUrl).getFields(param, function (serviceResult) {
                if (serviceResult.result && serviceResult.result.fieldNames && serviceResult.result.fieldNames.length > 0) {
                    fieldStatistic(serviceResult.result.fieldNames[0]);
                }
            });
        }
    }

    //统计结果
    function fieldStatistic(fieldName) {
        if (currentData) {
            var param = new mapboxgl.supermap.FieldStatisticsParameters({
                datasource: currentData.dataSourceName,
                dataset: currentData.dataSetName,
                fieldName: fieldName,
                statisticMode: [
                    mapboxgl.supermap.StatisticMode.MAX,
                    mapboxgl.supermap.StatisticMode.MIN,
                    mapboxgl.supermap.StatisticMode.SUM,
                    mapboxgl.supermap.StatisticMode.AVERAGE,
                    mapboxgl.supermap.StatisticMode.STDDEVIATION,
                    mapboxgl.supermap.StatisticMode.VARIANCE
                ]
            });
            new mapboxgl.supermap.FieldService(dataUrl).getFieldStatisticsInfo(param, function (serviceResult) {
                showResult(serviceResult.result);
            });
        }
    }

    function showResult(serviceResult) {
        if (!serviceResult) {
            return;
        }

        var tableName = document.getElementById("tableName");
        tableName.innerHTML = '<strong data-i18n="resources.text_layer"></strong>（' + (currentData ? currentData.layerName : '') + '）&nbsp;&nbsp;&nbsp;<strong data-i18n="resources.text_field"></strong>（' + serviceResult.fieldName + '）';

        var keys = ["AVERAGE", "MAX", "MIN", "STDDEVIATION", "SUM", "VARIANCE"];
        document.getElementById("AVERAGE").textContent = serviceResult[keys[0]];
        document.getElementById("MAX").textContent = serviceResult[keys[1]];
        document.getElementById("MIN").textContent = serviceResult[keys[2]];
        document.getElementById("STDDEVIATION").textContent = serviceResult[keys[3]];
        document.getElementById("SUM").textContent = serviceResult[keys[4]];
        document.getElementById("VARIANCE").textContent = serviceResult[keys[5]];
    }
</script>

</body>
</html>
