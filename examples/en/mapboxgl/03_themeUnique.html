<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_themeUnique"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<script type="text/javascript" src="../../../dist/mapboxgl/include-mapboxgl.js"></script>
<span id="show"></span>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";

    var attribution = "<a href='https://www.mapbox.com/about/maps/' target='_blank'>© Mapbox </a>" +
       "with <span>© <a href='https://iclient.supermap.io' target='_blank'>SuperMap iClient</a> | </span>" +
       " Map Data <span>© <a href='http://support.supermap.com.cn/product/iServer.aspx' target='_blank'>SuperMap iServer</a></span> ";

    var dataUrl = host + "/iserver/services/map-World_en/rest/maps/World%20Map_VEC";
    var map = new mapboxgl.Map({
        container: 'map',
        style: {
            "version": 8,
            "sources": {
                "raster-tiles": {
                    "attribution": attribution,
                    "type": "raster",
                    "tiles": [host + '/iserver/services/map-World_en/rest/maps/World%20Map_VEC/zxyTileImage.png?prjCoordSys='+encodeURIComponent('{"epsgCode":3857}')+'&z={z}&x={x}&y={y}'],
                    "tileSize": 256,
                },
            },
            "layers": [{
                "id": "simple-tiles",
                "type": "raster",
                "source": "raster-tiles",
                "minzoom": 0,
                "maxzoom": 22
            }]
        },
        center: [0, 0],
        zoom: 2
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-left');
    map.addControl(new mapboxgl.supermap.LogoControl({ link: "https://iclient.supermap.io" }), 'bottom-right');

    function createTheme() {
        var style1, style2, style3, style4, style5, style6, style7, style8;
        style1 = new mapboxgl.supermap.ServerStyle({
            fillForeColor: new mapboxgl.supermap.ServerColor(248, 203, 249),
            lineColor: new mapboxgl.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style2 = new mapboxgl.supermap.ServerStyle({
            fillForeColor: new mapboxgl.supermap.ServerColor(196, 255, 189),
            lineColor: new mapboxgl.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style3 = new mapboxgl.supermap.ServerStyle({
            fillForeColor: new mapboxgl.supermap.ServerColor(255, 0, 0),
            lineColor: new mapboxgl.supermap.ServerColor(200, 0, 0),
            lineWidth: 0.5
        });
        style4 = new mapboxgl.supermap.ServerStyle({
            fillForeColor: new mapboxgl.supermap.ServerColor(255, 239, 168),
            lineColor: new mapboxgl.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style5 = new mapboxgl.supermap.ServerStyle({
            fillForeColor: new mapboxgl.supermap.ServerColor(173, 209, 255),
            lineColor: new mapboxgl.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style6 = new mapboxgl.supermap.ServerStyle({
            fillForeColor: new mapboxgl.supermap.ServerColor(132, 164, 232),
            lineColor: new mapboxgl.supermap.ServerColor(255, 255, 255),
            lineWidth: 0.5
        });
        style7 = new mapboxgl.supermap.ServerStyle({
            fillForeColor: new mapboxgl.supermap.ServerColor(0, 255, 0),
            lineColor: new mapboxgl.supermap.ServerColor(0, 200, 0),
            lineWidth: 0.5
        });
        style8 = new mapboxgl.supermap.ServerStyle({
            fillForeColor: new mapboxgl.supermap.ServerColor(0, 206, 209),
            lineColor: new mapboxgl.supermap.ServerColor(0, 160, 160),
            lineWidth: 0.5
        });

        var themeUniqueIteme1 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "China",
                style: style3
            }),
            themeUniqueIteme2 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Russia",
                style: style2
            }),
            themeUniqueIteme3 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "United States of America",
                style: style4
            }),
            themeUniqueIteme4 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Japan",
                style: style5
            }),
            themeUniqueIteme5 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "India",
                style: style6
            }),
            themeUniqueIteme6 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Brazil",
                style: style7
            }),
            themeUniqueIteme7 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Canada",
                style: style8
            }),
            themeUniqueIteme8 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Australia",
                style: style1
            }),
            themeUniqueIteme9 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "France",
                style: style2
            }),
            themeUniqueIteme10 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Germany",
                style: style4
            }),
            themeUniqueIteme11 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "United Kingdom",
                style: style5
            }),
            themeUniqueIteme12 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Greenland",
                style: style6
            }),
            themeUniqueIteme13 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Mexico",
                style: style7
            }),
            themeUniqueIteme14 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Spain",
                style: style8
            }),
            themeUniqueIteme15 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Italy",
                style: style1
            }),
            themeUniqueIteme16 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Poland",
                style: style2
            }),
            themeUniqueIteme17 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Turkey",
                style: style4
            }),
            themeUniqueIteme18 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Saudi Arabia",
                style: style5
            }),
            themeUniqueIteme19 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "South Africa",
                style: style6
            }),
            themeUniqueIteme20 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Egypt",
                style: style7
            }),
            themeUniqueIteme21 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Indonesia",
                style: style8
            }),
            themeUniqueIteme22 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Thailand",
                style: style1
            }),
            themeUniqueIteme23 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Kazakhstan",
                style: style2
            }),
            themeUniqueIteme24 = new mapboxgl.supermap.ThemeUniqueItem({
                unique: "Mongolia",
                style: style4
            });

        var themeUniqueItemes = [
            themeUniqueIteme1, themeUniqueIteme2, themeUniqueIteme3,
            themeUniqueIteme4, themeUniqueIteme5, themeUniqueIteme6,
            themeUniqueIteme7, themeUniqueIteme8, themeUniqueIteme9,
            themeUniqueIteme10, themeUniqueIteme11, themeUniqueIteme12,
            themeUniqueIteme13, themeUniqueIteme14, themeUniqueIteme15,
            themeUniqueIteme16, themeUniqueIteme17, themeUniqueIteme18,
            themeUniqueIteme19, themeUniqueIteme20, themeUniqueIteme21,
            themeUniqueIteme22, themeUniqueIteme23, themeUniqueIteme24
        ];

        var themeUnique = new mapboxgl.supermap.ThemeUnique({
            uniqueExpression: "Country_EN",
            items: themeUniqueItemes,
            defaultStyle: style1
        });
        var themeParameters = new mapboxgl.supermap.ThemeParameters({
            datasetNames: ["Country_R"],
            dataSourceNames: ["World"],
            themes: [themeUnique]
        });

        new mapboxgl.supermap.ThemeService(dataUrl).getThemeInfo(themeParameters).then(function (serviceResult) {
            var result = serviceResult.result;
            if (result && result.newResourceID) {
                map.addSource("theme", {
                    "type": 'raster',
                    "tiles": [host + '/iserver/services/map-World_en/rest/maps/World%20Map_VEC/zxyTileImage.png?prjCoordSys='+encodeURIComponent('{"epsgCode":3857}')+'&z={z}&x={x}&y={y}&transparent=true&cacheEnabled=false&layersID=' + result.newResourceID],
                    "tileSize": 256,
                });

                map.addLayer({
                    "id": "themeLayer",
                    "type": "raster",
                    "source": "theme",
                });
            }
        })
    }

    map.on('load', function () {

        createTheme();
    });

</script>

</body>
</html>
