<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="resources.title_themeLabel"></title>
    <script type="text/javascript" src="../../js/include-web.js"></script>
</head>
<body style=" margin: 0;overflow: hidden;background: #fff;width: 100%;height:100%;position: absolute;top: 0;">
<div id="map" style="margin:0 auto;width: 100%;height: 100%"></div>
<script type="text/javascript" src="../../../dist/mapboxgl/include-mapboxgl.js"></script>
<span id="show"></span>
<script type="text/javascript">
    var host = window.isLocal ? window.server : "https://iserver.supermap.io";

    var attribution = "<a href='https://www.mapbox.com/about/maps/' target='_blank'>© Mapbox </a>" +
       "with <span>© <a href='https://iclient.supermap.io' target='_blank'>SuperMap iClient</a> | </span>" +
       " Map Data <span>© <a href='http://support.supermap.com.cn/product/iServer.aspx' target='_blank'>SuperMap iServer</a></span> ";

    var dataUrl = host + "/iserver/services/map-World_en/rest/maps/World%20Map_VEC";
    var map = new mapboxgl.Map({
        container: 'map',
        style: {
            "version": 8,
            "sources": {
                "raster-tiles": {
                    "attribution": attribution,
                    "type": "raster",
                    "tiles": [host + '/iserver/services/map-World_en/rest/maps/World%20Map_VEC/zxyTileImage.png?prjCoordSys='+encodeURIComponent('{"epsgCode":3857}')+'&z={z}&x={x}&y={y}'],
                    "tileSize": 256,
                },
            },
            "layers": [{
                "id": "simple-tiles",
                "type": "raster",
                "source": "raster-tiles",
                "minzoom": 0,
                "maxzoom": 22
            }]
        },
        center: [0, 0],
        zoom: 2
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-left');
    map.addControl(new mapboxgl.supermap.LogoControl({ link: "https://iclient.supermap.io" }), 'bottom-right');


    function createTheme() {
        var style1 = new mapboxgl.supermap.ServerTextStyle({
            fontHeight: 4,
            foreColor: new mapboxgl.supermap.ServerColor(100, 20, 50),
            sizeFixed: true,
            bold: true
        });
        var style2 = new mapboxgl.supermap.ServerTextStyle({
            fontHeight: 4,
            foreColor: new mapboxgl.supermap.ServerColor(250, 0, 0),
            sizeFixed: true,
            bold: true
        });
        var style3 = new mapboxgl.supermap.ServerTextStyle({
            fontHeight: 4,
            foreColor: new mapboxgl.supermap.ServerColor(93, 95, 255),
            sizeFixed: true,
            bold: true
        });
        var themeLabelItem1 = new mapboxgl.supermap.ThemeLabelItem({
            start: 0.0,
            end: 100,
            style: style1
        });
        var themeLabelItem2 = new mapboxgl.supermap.ThemeLabelItem({
            start: 100,
            end: 500,
            style: style2
        });
        var themeLabelItem3 = new mapboxgl.supermap.ThemeLabelItem({
            start: 500,
            end: 1000,
            style: style3
        });
        var themeLabelItem4 = new mapboxgl.supermap.ThemeLabelItem({
            start: 0.0,
            end: 55,
            style: style1
        });
        var themeLabelItem5 = new mapboxgl.supermap.ThemeLabelItem({
            start: 55,
            end: 109,
            style: style2
        });
        var themeLabelItem6 = new mapboxgl.supermap.ThemeLabelItem({
            start: 109,
            end: 300,
            style: style3
        });

        var themeLabel = new mapboxgl.supermap.ThemeLabel({
            matrixCells: [
                [new mapboxgl.supermap.LabelThemeCell({
                    themeLabel: new mapboxgl.supermap.ThemeLabel({
                        labelExpression: "SmUserID",
                        rangeExpression: "SmUserID",
                        numericPrecision: 0,
                        items: [themeLabelItem1, themeLabelItem2, themeLabelItem3]
                    })
                })],
                [new mapboxgl.supermap.LabelThemeCell({
                    themeLabel: new mapboxgl.supermap.ThemeLabel({
                        labelExpression: "Capital_EN",
                        rangeExpression: "SmID",
                        numericPrecision: 0,
                        items: [themeLabelItem4, themeLabelItem5, themeLabelItem6]
                    })
                })]
            ],
            background: new mapboxgl.supermap.ThemeLabelBackground({
                backStyle: new mapboxgl.supermap.ServerStyle({
                    fillForeColor: new mapboxgl.supermap.ServerColor(179, 209, 193),
                    fillOpaqueRate: 60,
                    lineWidth: 0.1
                }),
                labelBackShape: "RECT"
            })
        });
        var themeParameters = new mapboxgl.supermap.ThemeParameters({
            themes: [themeLabel],
            datasetNames: ["Capital_P"],
            dataSourceNames: ["World"]
        });

        new mapboxgl.supermap.ThemeService(dataUrl).getThemeInfo(themeParameters).then(function (serviceResult) {
            var result = serviceResult.result;
            console.log('Theme result:', result);
            if (result && result.newResourceID) {
                map.addSource("theme", {
                    "type": 'raster',
                    "tiles": [host + '/iserver/services/map-World_en/rest/maps/World%20Map_VEC/zxyTileImage.png?prjCoordSys='+encodeURIComponent('{"epsgCode":3857}')+'&z={z}&x={x}&y={y}&transparent=true&cacheEnabled=false&layersID=' + result.newResourceID],
                    "tileSize": 256,
                });

                map.addLayer({
                    "id": "themeLayer",
                    "type": "raster",
                    "source": "theme",
                });
            }
        })
    }

    map.on('load', function () {

        createTheme();
    });

</script>

</body>
</html>
