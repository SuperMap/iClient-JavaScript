<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="resources.title_tiledMapLayer_displayFilters"></title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      #land-use-control {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 10;
        width: 260px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 32px);
        overflow: hidden;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
        color: #333;
        font: 14px/1.5 Arial, "Microsoft YaHei", sans-serif;
      }

      #land-use-control h3 {
        margin: 0;
        padding: 10px 12px;
        border-bottom: 1px solid #e5e5e5;
        font-size: 15px;
        font-weight: 600;
      }

      #land-use-toolbar {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #e5e5e5;
      }

      #land-use-toolbar button {
        padding: 3px 9px;
        border: 1px solid #c8c8c8;
        border-radius: 3px;
        background: #fff;
        color: #333;
        cursor: pointer;
        font: inherit;
      }

      #land-use-toolbar button:hover {
        border-color: #1890ff;
        color: #1890ff;
      }

      #land-use-list {
        max-height: calc(100vh - 150px);
        padding: 6px 12px 10px;
        overflow-y: auto;
      }

      .land-use-item {
        display: flex;
        align-items: center;
        min-height: 28px;
        cursor: pointer;
        user-select: none;
      }

      .land-use-item input {
        margin: 0 7px 0 0;
      }

      .land-use-swatch {
        width: 13px;
        height: 13px;
        margin-right: 6px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        box-sizing: border-box;
      }

      .land-use-loading {
        margin: 5px 0;
        color: #777;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <section id="land-use-control" data-i18n="[aria-label]resources.text_displayFiltersLandUseType">
      <h3 data-i18n="resources.text_displayFiltersLandUseType"></h3>
      <div id="land-use-toolbar">
        <button type="button" id="select-all" data-i18n="resources.text_displayFiltersSelectAll"></button>
        <button type="button" id="select-none" data-i18n="resources.text_displayFiltersSelectNone"></button>
      </div>
      <div id="land-use-list">
        <p class="land-use-loading" data-i18n="resources.text_displayFiltersLoading"></p>
      </div>
    </section>

    <script type="text/javascript" src="../js/include-web.js"></script>
    <script type="text/javascript" src="../../dist/ol/include-ol.js"></script>
    <script type="text/javascript">
      var host = window.isLocal ? window.server : 'https://iserver.supermap.io';
      var mapUrl = host + '/iserver/services/map-jingjin/rest/maps/京津地区土地利用现状图';
      var landUseLayerName = 'Landuse_R@Jingjin#1';
      var filterField = 'LANDTYPE';
      var landUseTypes = [];
      var landUseColors = {};
      var selectedLandUseTypes = {};
      var pendingAllTypes = null;
      var map = null;
      var layer = null;

      function getDisplayFilters() {
        var selected = landUseTypes.filter(function (type) {
          return selectedLandUseTypes[type];
        });
        var filter = 'SmID < 0';
        if (selected.length) {
          filter = selected
            .map(function (type) {
              return filterField + " = '" + type.replace(/'/g, "''") + "'";
            })
            .join(' OR ');
        }
        var displayFilters = {};
        displayFilters[landUseLayerName] = filter;
        return displayFilters;
      }

      function createSource(mapInfo) {
        var sourceOptions = ol.source.TileSuperMapRest.optionsFromMapJSON(mapUrl, mapInfo, true);
        sourceOptions.displayFilters = getDisplayFilters();
        return new ol.source.TileSuperMapRest(sourceOptions);
      }

      function refreshLayer() {
        if (!map || !layer) {
          return;
        }
        layer.getSource().updateParams({
          displayFilters: getDisplayFilters()
        });
      }

      function renderLandUseList() {
        var list = document.getElementById('land-use-list');
        list.innerHTML = '';
        landUseTypes.forEach(function (type) {
          var label = document.createElement('label');
          label.className = 'land-use-item';
          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = !!selectedLandUseTypes[type];
          checkbox.addEventListener('change', function () {
            selectedLandUseTypes[type] = checkbox.checked;
            refreshLayer();
          });
          var swatch = document.createElement('span');
          swatch.className = 'land-use-swatch';
          swatch.style.backgroundColor = landUseColors[type];
          label.appendChild(checkbox);
          label.appendChild(swatch);
          label.appendChild(document.createTextNode(type));
          list.appendChild(label);
        });
      }

      function setAllTypes(checked) {
        if (!landUseTypes.length) {
          pendingAllTypes = checked;
          return;
        }
        landUseTypes.forEach(function (type) {
          selectedLandUseTypes[type] = checked;
        });
        renderLandUseList();
        refreshLayer();
      }

      function findLandUseTheme(layerInfo) {
        if (!layerInfo) {
          return null;
        }
        if (layerInfo.name === landUseLayerName && layerInfo.theme && layerInfo.theme.items) {
          return layerInfo;
        }
        var layers = layerInfo.subLayers && layerInfo.subLayers.layers;
        if (!layers) {
          return null;
        }
        for (var i = 0; i < layers.length; i++) {
          var result = findLandUseTheme(layers[i]);
          if (result) {
            return result;
          }
        }
        return null;
      }

      var mapInfo = null;

      /*
       * 方式一：手动创建地图和图层。
       */
      function createMap() {
        return new ol.supermap.MapService(mapUrl).getMapInfo().then(function (serviceResult) {
          mapInfo = serviceResult.result;
          var viewOptions = ol.supermap.viewOptionsFromMapJSON(mapInfo);
          map = new ol.Map({
            target: 'map',
            view: new ol.View(viewOptions)
          });
          layer = new ol.layer.Tile({ source: createSource(mapInfo) });
          map.addLayer(layer);
        });
      }

      /*
       * 方式二：使用 ol.supermap.initMap 根据服务信息创建地图和图层。
       */
      // function createMap() {
      //   return ol.supermap.initMap(mapUrl, {
      //     sourceOptions: {
      //       displayFilters: getDisplayFilters()
      //     }
      //   }).then(function (result) {
      //     map = result.map;
      //     layer = result.layer;
      //   });
      // }

      function loadLandUseTypes() {
        new ol.supermap.LayerInfoService(mapUrl)
          .getLayersInfo()
          .then(function (serviceResult) {
            var themeLayer = findLandUseTheme(serviceResult && serviceResult.result);
            if (!themeLayer) {
              throw new Error('Land use theme layer not found');
            }
            themeLayer.theme.items.forEach(function (item) {
              var type = item.unique || item.caption;
              if (type && landUseTypes.indexOf(type) === -1) {
                landUseTypes.push(type);
                var color = item.style && item.style.fillForeColor;
                if (color) {
                  landUseColors[type] = 'rgb(' + color.red + ', ' + color.green + ', ' + color.blue + ')';
                }
              }
            });
            if (!landUseTypes.length) {
              throw new Error('No land use types found');
            }
            var selected = pendingAllTypes === null ? true : pendingAllTypes;
            landUseTypes.forEach(function (type) {
              selectedLandUseTypes[type] = selected;
            });
            pendingAllTypes = null;
            renderLandUseList();
            return createMap();
          })
          .catch(function () {
            document.getElementById('land-use-list').innerHTML =
              '<p class="land-use-loading" data-i18n="resources.text_displayFiltersLoadError"></p>';
            if (window.Localization) { Localization.localize(); }
          });
      }

      document.getElementById('select-all').addEventListener('click', function () {
        setAllTypes(true);
      });
      document.getElementById('select-none').addEventListener('click', function () {
        setAllTypes(false);
      });

      loadLandUseTypes();

    </script>
  </body>
</html>
